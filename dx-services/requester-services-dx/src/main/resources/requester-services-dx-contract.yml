swagger: 2.0
info:
  version: 1.0.0
  title: RequesterServicesDx Service
  description: |
    DigiLocker and eMudra eSign requester integration service.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /requester-services-dx
x-api-id: org.egov.requester.services.dx
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /digilocker/details:
    post:
      summary: Getdetails
      description: Getdetails for requester-services-dx. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Getdetails completed successfully
          schema:
            $ref: "#/definitions/TokenResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Digilocker
      parameters:
        - name: TokenResponse
          in: body
          description: Request payload with RequestInfo and domain data for getdetails
          required: True
          schema:
            $ref: "#/definitions/TokenResponse"
  /digilocker/file:
    post:
      summary: Getfile
      description: Getfile for requester-services-dx. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Getfile completed successfully
          schema:
            $ref: "#/definitions/Object"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Digilocker
      parameters:
        - name: Object
          in: body
          description: Request payload with RequestInfo and domain data for getfile
          required: True
          schema:
            $ref: "#/definitions/Object"
  /digilocker/issuedfiles:
    post:
      summary: Getissuedfiles
      description: Getissuedfiles for requester-services-dx. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Getissuedfiles completed successfully
          schema:
            $ref: "#/definitions/TokenResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Digilocker
      parameters:
        - name: TokenResponse
          in: body
          description: Request payload with RequestInfo and domain data for getissuedfiles
          required: True
          schema:
            $ref: "#/definitions/TokenResponse"
  /digilocker/token:
    post:
      summary: Gettoken
      description: Gettoken for requester-services-dx. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Gettoken completed successfully
          schema:
            $ref: "#/definitions/TokenResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Digilocker
      parameters:
        - name: TokenResponse
          in: body
          description: Request payload with RequestInfo and domain data for gettoken
          required: True
          schema:
            $ref: "#/definitions/TokenResponse"
  /digilocker/token/citizen:
    post:
      summary: Gettokencitizen
      description: Gettokencitizen for requester-services-dx. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Gettokencitizen completed successfully
          schema:
            $ref: "#/definitions/Object"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Digilocker
      parameters:
        - name: Object
          in: body
          description: Request payload with RequestInfo and domain data for gettokencitizen
          required: True
          schema:
            $ref: "#/definitions/Object"
  /digipin/v1/_generate:
    post:
      summary: Generate digipin v1
      description: Generate digipin v1 for requester-services-dx. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Generate digipin v1 completed successfully
          schema:
            $ref: "#/definitions/DiginpinResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Digipin
      parameters:
        - name: DiginpinResponse
          in: body
          description: Request payload with RequestInfo and domain data for generate digipin v1
          required: True
          schema:
            $ref: "#/definitions/DiginpinResponse"
  /eSign/filestoreId/v1/_search:
    post:
      summary: Search eSign filestoreId v1
      description: Search eSign filestoreId v1 for requester-services-dx. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Search eSign filestoreId v1 completed successfully
          schema:
            $ref: "#/definitions/TransactionResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Esign
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/TransactionResponse"
definitions:
  TokenResponse:
    type: object
    description: Request/Response contract for TokenResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      RequesterServicesDxApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/RequesterServicesDxApplication"
  DiginpinResponse:
    type: object
    description: Request/Response contract for DiginpinResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      RequesterServicesDxApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/RequesterServicesDxApplication"
  TransactionResponse:
    type: object
    description: Request/Response contract for TransactionResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      RequesterServicesDxApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/RequesterServicesDxApplication"
  Object:
    type: object
    description: Request/Response contract for Object
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      RequesterServicesDxApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/RequesterServicesDxApplication"
  RequesterServicesDxApplication:
    type: object
    description: A domain application object for requester-services-dx
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
