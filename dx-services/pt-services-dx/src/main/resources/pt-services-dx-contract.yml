swagger: 2.0
info:
  version: 1.0.0
  title: PtServicesDx Service
  description: |
    Property Tax data-exchange service.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /pt-services-dx
x-api-id: org.egov.pt.services.dx
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /user/details:
    post:
      summary: Getdetails
      description: Getdetails for pt-services-dx. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Getdetails completed successfully
          schema:
            $ref: "#/definitions/TokenResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - User
      parameters:
        - name: TokenResponse
          in: body
          description: Request payload with RequestInfo and domain data for getdetails
          required: True
          schema:
            $ref: "#/definitions/TokenResponse"
  /user/file/{id}:
    post:
      summary: Getfile
      description: Getfile for pt-services-dx. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Getfile completed successfully
          schema:
            $ref: "#/definitions/Object"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - User
      parameters:
        - name: Object
          in: body
          description: Request payload with RequestInfo and domain data for getfile
          required: True
          schema:
            $ref: "#/definitions/Object"
  /user/issuedfiles:
    post:
      summary: Getissuedfiles
      description: Getissuedfiles for pt-services-dx. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Getissuedfiles completed successfully
          schema:
            $ref: "#/definitions/TokenResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - User
      parameters:
        - name: TokenResponse
          in: body
          description: Request payload with RequestInfo and domain data for getissuedfiles
          required: True
          schema:
            $ref: "#/definitions/TokenResponse"
  /user/token:
    post:
      summary: Gettoken
      description: Gettoken for pt-services-dx. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Gettoken completed successfully
          schema:
            $ref: "#/definitions/TokenResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - User
      parameters:
        - name: TokenResponse
          in: body
          description: Request payload with RequestInfo and domain data for gettoken
          required: True
          schema:
            $ref: "#/definitions/TokenResponse"
definitions:
  TokenResponse:
    type: object
    description: Request/Response contract for TokenResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      PtServicesDxApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/PtServicesDxApplication"
  Object:
    type: object
    description: Request/Response contract for Object
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      PtServicesDxApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/PtServicesDxApplication"
  PtServicesDxApplication:
    type: object
    description: A domain application object for pt-services-dx
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
