swagger: 2.0
info:
  version: 1.0.0
  title: Vendor Service
  description: |
    Vendor registry service.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /vendor
x-api-id: org.egov.vendor
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /v1/_create:
    post:
      summary: Create v1
      description: Create v1 for vendor. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Create v1 completed successfully
          schema:
            $ref: "#/definitions/VendorResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1
      parameters:
        - name: VendorResponse
          in: body
          description: Request payload with RequestInfo and domain data for create v1
          required: True
          schema:
            $ref: "#/definitions/VendorResponse"
  /v1/_plainsearch:
    post:
      summary: Plain search v1
      description: Plain search v1 for vendor. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Plain search v1 completed successfully
          schema:
            $ref: "#/definitions/VendorResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/VendorResponse"
  /v1/_search:
    post:
      summary: Search v1
      description: Search v1 for vendor. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Search v1 completed successfully
          schema:
            $ref: "#/definitions/VendorResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/VendorResponse"
  /v1/_update:
    post:
      summary: Update v1
      description: Update v1 for vendor. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Update v1 completed successfully
          schema:
            $ref: "#/definitions/VendorResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1
      parameters:
        - name: VendorResponse
          in: body
          description: Request payload with RequestInfo and domain data for update v1
          required: True
          schema:
            $ref: "#/definitions/VendorResponse"
definitions:
  VendorResponse:
    type: object
    description: Request/Response contract for VendorResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      VendoApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/VendoApplication"
  VendoApplication:
    type: object
    description: A domain application object for vendor
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
