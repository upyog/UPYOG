server.contextPath=/works-management-service
server.servlet.context-path=/works-management-service
server.port=8280
app.timezone=UTC
management.endpoints.web.base-path=/

# ---------------- DATABASE ----------------
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/upyog
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=20

# ---------------- FLYWAY ----------------
spring.flyway.url=jdbc:postgresql://localhost:5432/upyog
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.table=wms_schema_version
spring.flyway.baseline-on-migrate=true
spring.flyway.outOfOrder=true
spring.flyway.locations=classpath:/db/migration/main
spring.flyway.enabled=true

# ---------------- KAFKA (tracer) ----------------
kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=works-management-service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false

kafka.consumer.config.auto_commit=true
kafka.consumer.config.auto_commit_interval=100
kafka.consumer.config.session_timeout=15000
kafka.consumer.config.auto_offset_reset=earliest
kafka.producer.config.retries_config=0
kafka.producer.config.batch_size_config=16384
kafka.producer.config.linger_ms_config=1
kafka.producer.config.buffer_memory_config=33554432

tracer.kafkaMessageLoggingEnabled=true
tracer.errorsTopic=works-management-service-errors

# Persister topics
wms.kafka.topic.save-action-plan=save-wms-action-plan
wms.kafka.topic.update-action-plan=update-wms-action-plan
wms.kafka.topic.update-action-plan-workflow=update-wms-action-plan-workflow

# ---------------- BUSINESS ----------------
# Business time zone used for date rules (e.g. approval date not after today)
wms.business.timezone=Asia/Kolkata
wms.search.default-limit=10
wms.search.max-limit=100

# ---------------- WORKFLOW ----------------
# false = skip egov-workflow-v2 completely (status handled inside the service).
# Can be overridden per state tenant by MDMS WorksManagement.ActionPlanConfig.workflowEnabled
wms.workflow.enabled=true
wms.workflow.business-service=WMS_ACTION_PLAN
wms.workflow.module-name=works-management-service
egov.workflow.host=http://egov-workflow-v2.egov:8080
egov.workflow.transition.path=/egov-workflow-v2/egov-wf/process/_transition

# ---------------- ID GEN ----------------
egov.idgen.host=http://egov-idgen.egov:8080
egov.idgen.path=/egov-idgen/id/_generate
wms.idgen.application-number.name=wms.actionplan.applicationnumber
wms.idgen.action-plan-number.name=wms.actionplan.number
wms.idgen.component-number.name=wms.actionplan.componentnumber

# ---------------- MDMS ----------------
egov.mdms.host=http://egov-mdms-service.egov:8080
egov.mdms.search.path=/egov-mdms-service/v1/_search
# MDMS response cache (per state tenant). 0 disables caching.
wms.mdms.cache.ttl-seconds=300

# ---------------- CALCULATOR ----------------
# Phase 1 has no fee. Turn on when a fee is configured in MDMS FeeConfig.
wms.calculator.enabled=false
wms.calculator.host=http://works-management-calculator.egov:8080
wms.calculator.calculate.path=/works-management-calculator/v1/_calculate
