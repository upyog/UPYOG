swagger: 2.0
info:
  version: 1.0.0
  title: EwasteServices Service
  description: |
    E-waste collection request service.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /ewaste-services
x-api-id: org.egov.ewaste.services
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /ewaste-request/_create:
    post:
      summary: Create ewaste-request
      description: Create ewaste-request for ewaste-services. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Create ewaste-request completed successfully
          schema:
            $ref: "#/definitions/EwasteRegistrationResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Ewaste Request
      parameters:
        - name: EwasteRegistrationResponse
          in: body
          description: Request payload with RequestInfo and domain data for create ewaste-request
          required: True
          schema:
            $ref: "#/definitions/EwasteRegistrationResponse"
  /ewaste-request/_search:
    post:
      summary: Search ewaste-request
      description: Search ewaste-request for ewaste-services. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Search ewaste-request completed successfully
          schema:
            $ref: "#/definitions/EwasteRegistrationResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Ewaste Request
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/EwasteRegistrationResponse"
  /ewaste-request/_update:
    post:
      summary: Update ewaste-request
      description: Update ewaste-request for ewaste-services. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Update ewaste-request completed successfully
          schema:
            $ref: "#/definitions/EwasteRegistrationResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Ewaste Request
      parameters:
        - name: EwasteRegistrationResponse
          in: body
          description: Request payload with RequestInfo and domain data for update ewaste-request
          required: True
          schema:
            $ref: "#/definitions/EwasteRegistrationResponse"
definitions:
  EwasteRegistrationResponse:
    type: object
    description: Request/Response contract for EwasteRegistrationResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      EwastApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/EwastApplication"
  EwastApplication:
    type: object
    description: A domain application object for ewaste-services
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
