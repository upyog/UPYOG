swagger: 2.0
info:
  version: 1.0.0
  title: TpServices Service
  description: |
    Tree pruning application service.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /tp-services
x-api-id: org.egov.tp.services
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /tree-pruning/v1/_create:
    post:
      summary: Create tree-pruning v1
      description: Create tree-pruning v1 for tp-services. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Create tree-pruning v1 completed successfully
          schema:
            $ref: "#/definitions/TreePruningBookingResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Tree Pruning
      parameters:
        - name: TreePruningBookingResponse
          in: body
          description: Request payload with RequestInfo and domain data for create tree-pruning v1
          required: True
          schema:
            $ref: "#/definitions/TreePruningBookingResponse"
  /tree-pruning/v1/_search:
    post:
      summary: Search tree-pruning v1
      description: Search tree-pruning v1 for tp-services. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Search tree-pruning v1 completed successfully
          schema:
            $ref: "#/definitions/TreePruningSearchResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Tree Pruning
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/TreePruningSearchResponse"
  /tree-pruning/v1/_update:
    post:
      summary: Update tree-pruning v1
      description: Update tree-pruning v1 for tp-services. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Update tree-pruning v1 completed successfully
          schema:
            $ref: "#/definitions/TreePruningBookingResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Tree Pruning
      parameters:
        - name: TreePruningBookingResponse
          in: body
          description: Request payload with RequestInfo and domain data for update tree-pruning v1
          required: True
          schema:
            $ref: "#/definitions/TreePruningBookingResponse"
definitions:
  TreePruningBookingResponse:
    type: object
    description: Request/Response contract for TreePruningBookingResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      TpApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/TpApplication"
  TreePruningSearchResponse:
    type: object
    description: Request/Response contract for TreePruningSearchResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      TpApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/TpApplication"
  TpApplication:
    type: object
    description: A domain application object for tp-services
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
