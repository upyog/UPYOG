swagger: 2.0
info:
  version: 1.0.0
  title: TurnIoAdapter Service
  description: |
    Turn.io/WhatsApp adapter for PGR and conversational workflows.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /turn-io-adapter
x-api-id: org.egov.turn.io.adapter
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /_transform:
    post:
      summary: Transformservice
      description: Transformservice for turn-io-adapter. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Transformservice completed successfully
          schema:
            $ref: "#/definitions/Object"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Default
      parameters:
        - name: Object
          in: body
          description: Request payload with RequestInfo and domain data for transformservice
          required: True
          schema:
            $ref: "#/definitions/Object"
definitions:
  Object:
    type: object
    description: Request/Response contract for Object
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      TurnIoAdaptApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/TurnIoAdaptApplication"
  TurnIoAdaptApplication:
    type: object
    description: A domain application object for turn-io-adapter
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
