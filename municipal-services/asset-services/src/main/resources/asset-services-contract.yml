basePath: /asset-services
x-api-id: org.egov.asset.services
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /maintenance/v1/_create:
    post:
      summary: Create maintenance v1
      description: Create maintenance v1 for asset-services. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Create maintenance v1 completed successfully
          schema:
            $ref: "#/definitions/AssetMaintenanceResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Maintenance
      parameters:
        - name: AssetMaintenanceResponse
          in: body
          description: Request payload with RequestInfo and domain data for create maintenance v1
          required: True
          schema:
            $ref: "#/definitions/AssetMaintenanceResponse"
  /maintenance/v1/_search:
