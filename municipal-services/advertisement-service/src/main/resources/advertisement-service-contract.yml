    post:
      summary: Advertisementdeletedraft
      description: Advertisementdeletedraft for advertisement-service. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Advertisementdeletedraft completed successfully
          schema:
            $ref: "#/definitions/AdvertisementResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Booking
      parameters:
        - name: AdvertisementResponse
          in: body
          description: Request payload with RequestInfo and domain data for advertisementdeletedraft
          required: True
          schema:
            $ref: "#/definitions/AdvertisementResponse"
  /booking/booking:
