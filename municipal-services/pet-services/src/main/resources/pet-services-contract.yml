swagger: 2.0
info:
  version: 1.0.0
  title: PetServices Service
  description: |
    Pet registration service.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /pet-services
x-api-id: org.egov.pet.services
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /pet-registration/_create:
    post:
      summary: Create pet-registration
      description: Create pet-registration for pet-services. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Create pet-registration completed successfully
          schema:
            $ref: "#/definitions/PetRegistrationResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Pet Registration
      parameters:
        - name: PetRegistrationResponse
          in: body
          description: Request payload with RequestInfo and domain data for create pet-registration
          required: True
          schema:
            $ref: "#/definitions/PetRegistrationResponse"
  /pet-registration/_search:
    post:
      summary: Search pet-registration
      description: Search pet-registration for pet-services. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Search pet-registration completed successfully
          schema:
            $ref: "#/definitions/PetRegistrationResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Pet Registration
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/PetRegistrationResponse"
  /pet-registration/_update:
    post:
      summary: Update pet-registration
      description: Update pet-registration for pet-services. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Update pet-registration completed successfully
          schema:
            $ref: "#/definitions/PetRegistrationResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Pet Registration
      parameters:
        - name: PetRegistrationResponse
          in: body
          description: Request payload with RequestInfo and domain data for update pet-registration
          required: True
          schema:
            $ref: "#/definitions/PetRegistrationResponse"
  /pet-registration/pet-registration:
    post:
      summary: Pet-Registration
      description: Pet-Registration for pet-services. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Pet-Registration completed successfully
          schema:
            $ref: "#/definitions/Object"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Pet Registration
      parameters:
        - name: Object
          in: body
          description: Request payload with RequestInfo and domain data for pet-registration
          required: True
          schema:
            $ref: "#/definitions/Object"
  /pet-registration/trigger-advance-notification:
    post:
      summary: Triggeradvancenotification
      description: Triggeradvancenotification for pet-services. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Triggeradvancenotification completed successfully
          schema:
            $ref: "#/definitions/String"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Pet Registration
      parameters:
        - name: String
          in: body
          description: Request payload with RequestInfo and domain data for triggeradvancenotification
          required: True
          schema:
            $ref: "#/definitions/String"
  /pet-registration/trigger-expire-petapplications:
    post:
      summary: Triggerworkflowupdate
      description: Triggerworkflowupdate for pet-services. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Triggerworkflowupdate completed successfully
          schema:
            $ref: "#/definitions/String"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Pet Registration
      parameters:
        - name: String
          in: body
          description: Request payload with RequestInfo and domain data for triggerworkflowupdate
          required: True
          schema:
            $ref: "#/definitions/String"
definitions:
  Object:
    type: object
    description: Request/Response contract for Object
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      PetApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/PetApplication"
  String:
    type: object
    description: Request/Response contract for String
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      PetApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/PetApplication"
  PetRegistrationResponse:
    type: object
    description: Request/Response contract for PetRegistrationResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      PetApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/PetApplication"
  PetApplication:
    type: object
    description: A domain application object for pet-services
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
