server.contextPath=/works-management-calculator
server.servlet.context-path=/works-management-calculator
server.port=8281
app.timezone=UTC
management.endpoints.web.base-path=/

# ---------------- KAFKA (required by tracer) ----------------
kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=works-management-calculator
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false
kafka.consumer.config.auto_commit=true
kafka.consumer.config.auto_commit_interval=100
kafka.consumer.config.session_timeout=15000
kafka.consumer.config.auto_offset_reset=earliest
kafka.producer.config.retries_config=0
kafka.producer.config.batch_size_config=16384
kafka.producer.config.linger_ms_config=1
kafka.producer.config.buffer_memory_config=33554432
tracer.kafkaMessageLoggingEnabled=true
tracer.errorsTopic=works-management-calculator-errors

# ---------------- WORKS MANAGEMENT SERVICE ----------------
wms.service.host=http://works-management-service.egov:8080
wms.service.search.path=/works-management-service/action-plan/v1/_search

# ---------------- MDMS ----------------
egov.mdms.host=http://egov-mdms-service.egov:8080
egov.mdms.search.path=/egov-mdms-service/v1/_search
calculator.mdms.cache.ttl-seconds=300

# ---------------- BILLING ----------------
# Demand generation is off until a fee is configured (MDMS WorksManagement.FeeConfig, active=true)
calculator.demand.enabled=false
calculator.business-service=WMS.ACTION_PLAN
calculator.consumer-type=ACTION_PLAN
egov.billingservice.host=http://billing-service.egov:8080
egov.demand.create.path=/billing-service/demand/_create
egov.demand.update.path=/billing-service/demand/_update
egov.demand.search.path=/billing-service/demand/_search
