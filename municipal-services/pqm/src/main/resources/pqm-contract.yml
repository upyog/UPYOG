        201:
          description: Create plant user v1 completed successfully
          schema:
            $ref: "#/definitions/PlantUserResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Plant
      parameters:
        - name: PlantUserResponse
          in: body
          description: Request payload with RequestInfo and domain data for create plant user v1
          required: True
          schema:
            $ref: "#/definitions/PlantUserResponse"
