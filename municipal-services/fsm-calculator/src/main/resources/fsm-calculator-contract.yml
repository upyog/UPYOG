swagger: 2.0
info:
  version: 1.0.0
  title: FsmCalculator Service
  description: |
    FSM fee calculator and billing slab service.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /fsm-calculator
x-api-id: org.egov.fsm.calculator
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /v1/_advancebalancecalculate:
    post:
      summary: Advancebalancecalculate
      description: Advancebalancecalculate for fsm-calculator. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Advancebalancecalculate completed successfully
          schema:
            $ref: "#/definitions/AdvanceAmountResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1
      parameters:
        - name: AdvanceAmountResponse
          in: body
          description: Request payload with RequestInfo and domain data for advancebalancecalculate
          required: True
          schema:
            $ref: "#/definitions/AdvanceAmountResponse"
  /v1/_calculate:
    post:
      summary: Calculate
      description: Calculate for fsm-calculator. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Calculate completed successfully
          schema:
            $ref: "#/definitions/CalculationRes"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1
      parameters:
        - name: CalculationRes
          in: body
          description: Request payload with RequestInfo and domain data for calculate
          required: True
          schema:
            $ref: "#/definitions/CalculationRes"
  /v1/_cancellationfee:
    post:
      summary: Cancellationfee
      description: Cancellationfee for fsm-calculator. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Cancellationfee completed successfully
          schema:
            $ref: "#/definitions/CancellationAmountResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1
      parameters:
        - name: CancellationAmountResponse
          in: body
          description: Request payload with RequestInfo and domain data for cancellationfee
          required: True
          schema:
            $ref: "#/definitions/CancellationAmountResponse"
  /v1/_estimate:
    post:
      summary: Estimate
      description: Estimate for fsm-calculator. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Estimate completed successfully
          schema:
            $ref: "#/definitions/CalculationRes"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1
      parameters:
        - name: CalculationRes
          in: body
          description: Request payload with RequestInfo and domain data for estimate
          required: True
          schema:
            $ref: "#/definitions/CalculationRes"
  /v1/billingSlab/_create:
    post:
      summary: Create v1 billingSlab
      description: Create v1 billingSlab for fsm-calculator. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Create v1 billingSlab completed successfully
          schema:
            $ref: "#/definitions/BillingSlabResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1
      parameters:
        - name: BillingSlabResponse
          in: body
          description: Request payload with RequestInfo and domain data for create v1 billingslab
          required: True
          schema:
            $ref: "#/definitions/BillingSlabResponse"
  /v1/billingSlab/_search:
    post:
      summary: Search v1 billingSlab
      description: Search v1 billingSlab for fsm-calculator. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Search v1 billingSlab completed successfully
          schema:
            $ref: "#/definitions/BillingSlabResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/BillingSlabResponse"
  /v1/billingSlab/_update:
    post:
      summary: Update v1 billingSlab
      description: Update v1 billingSlab for fsm-calculator. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Update v1 billingSlab completed successfully
          schema:
            $ref: "#/definitions/BillingSlabResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1
      parameters:
        - name: BillingSlabResponse
          in: body
          description: Request payload with RequestInfo and domain data for update v1 billingslab
          required: True
          schema:
            $ref: "#/definitions/BillingSlabResponse"
definitions:
  BillingSlabResponse:
    type: object
    description: Request/Response contract for BillingSlabResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      FsmCalculatoApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/FsmCalculatoApplication"
  AdvanceAmountResponse:
    type: object
    description: Request/Response contract for AdvanceAmountResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      FsmCalculatoApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/FsmCalculatoApplication"
  CancellationAmountResponse:
    type: object
    description: Request/Response contract for CancellationAmountResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      FsmCalculatoApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/FsmCalculatoApplication"
  CalculationRes:
    type: object
    description: Request/Response contract for CalculationRes
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      FsmCalculatoApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/FsmCalculatoApplication"
  FsmCalculatoApplication:
    type: object
    description: A domain application object for fsm-calculator
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
