swagger: 2.0
info:
  version: 1.0.0
  title: NdcCalculator Service
  description: |
    This service provides APIs for the ndc-calculator module in the UPYOG platform.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /ndc-calculator
x-api-id: org.egov.ndc.calculator
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /v1/_calculate:
    post:
      summary: Calculate
      description: Calculate for ndc-calculator. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Calculate completed successfully
          schema:
            $ref: "#/definitions/CalculationRes"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1
      parameters:
        - name: CalculationRes
          in: body
          description: Request payload with RequestInfo and domain data for calculate
          required: True
          schema:
            $ref: "#/definitions/CalculationRes"
  /v1/_updatedemand:
    post:
      summary: Updatedemand
      description: Updatedemand for ndc-calculator. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Updatedemand completed successfully
          schema:
            $ref: "#/definitions/DemandResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1
      parameters:
        - name: DemandResponse
          in: body
          description: Request payload with RequestInfo and domain data for updatedemand
          required: True
          schema:
            $ref: "#/definitions/DemandResponse"
definitions:
  DemandResponse:
    type: object
    description: Request/Response contract for DemandResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      NdcCalculatoApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/NdcCalculatoApplication"
  CalculationRes:
    type: object
    description: Request/Response contract for CalculationRes
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      NdcCalculatoApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/NdcCalculatoApplication"
  NdcCalculatoApplication:
    type: object
    description: A domain application object for ndc-calculator
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
