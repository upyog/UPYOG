global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "upyog-aggregation-service"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["aggregation-service:8080"]
        labels:
          service: "upyog-aggregation-service"
          environment: "local"
