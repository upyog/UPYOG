# =============================================================================
# UPYOG Aggregation Service - QA Environment Configuration
# =============================================================================

server:
  port: 8080
  readTimeout: 30s
  writeTimeout: 30s
  idleTimeout: 120s
  shutdownTimeout: 15s
  maxRequestBodyMB: 5
  enableCompression: true

redis:
  host: redis-headless.qa
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0
  poolSize: 20
  minIdleConns: 5
  dialTimeout: 5s
  readTimeout: 3s
  writeTimeout: 3s
  enabled: true

auth:
  enabled: true
  jwksUrl: "https://keycloak.qa.upyog.org/auth/realms/upyog/protocol/openid-connect/certs"
  issuer: "https://keycloak.qa.upyog.org/auth/realms/upyog"
  audience: "upyog-client"
  tokenExpLeeway: 60
  publicPaths:
    - /health
    - /readiness
    - /liveness
    - /metrics

observability:
  metrics:
    enabled: true
    path: /metrics
    namespace: upyog
    subsystem: aggregation
  tracing:
    enabled: true
    endpoint: "jaeger-collector.observability:4317"
    serviceName: upyog-aggregation-service
    samplingRate: 0.25

providers:
  defaultTimeout: 10s
  maxRetries: 2
  cacheTTL: 5m

rateLimit:
  enabled: true
  requestsPerSecond: 200
  burst: 400

backend:
  services:
    inbox:
      baseUrl: "http://inbox-service.qa:8080"
      timeout: 10s
      maxConns: 50
      circuitThreshold: 5
      circuitTimeout: 30s
    billing:
      baseUrl: "http://billing-service.qa:8080"
      timeout: 10s
      maxConns: 30
      circuitThreshold: 5
      circuitTimeout: 30s
    property:
      baseUrl: "http://property-services.qa:8080"
      timeout: 10s
      maxConns: 30
      circuitThreshold: 5
      circuitTimeout: 30s
    workflow:
      baseUrl: "http://egov-workflow.qa:8080"
      timeout: 10s
      maxConns: 30
      circuitThreshold: 5
      circuitTimeout: 30s
    tl-services:
      baseUrl: "http://tl-services.qa:8080"
      timeout: 10s
      maxConns: 30
      circuitThreshold: 5
      circuitTimeout: 30s
    user-event:
      baseUrl: "http://egov-user-event.qa:8080"
      timeout: 10s
      maxConns: 30
      circuitThreshold: 5
      circuitTimeout: 30s
    advertisement:
      baseUrl: "http://advertisement-service.qa:8080"
      timeout: 10s
      maxConns: 30
      circuitThreshold: 5
      circuitTimeout: 30s
