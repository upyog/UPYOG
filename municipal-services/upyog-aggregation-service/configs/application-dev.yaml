# =============================================================================
# UPYOG Aggregation Service - Development Environment Configuration
# =============================================================================

server:
  port: 8090
  # The UPYOG API gateway routes /upyog-aggregation-service/** to this pod
  # WITHOUT stripping the prefix, so all routes are served under it.
  contextPath: /upyog-aggregation-service
  readTimeout: 30s
  writeTimeout: 30s
  idleTimeout: 120s
  shutdownTimeout: 15s
  maxRequestBodyMB: 5
  enableCompression: true

redis:
  host: redis.backbone
  port: 6379
  password: ""
  db: 0
  poolSize: 20
  minIdleConns: 5
  dialTimeout: 5s
  readTimeout: 3s
  writeTimeout: 3s
  enabled: true

auth:
  enabled: false
  jwksUrl: "https://keycloak.dev.upyog.org/auth/realms/upyog/protocol/openid-connect/certs"
  issuer: "https://keycloak.dev.upyog.org/auth/realms/upyog"
  audience: "upyog-client"
  tokenExpLeeway: 60
  publicPaths:
    - /health
    - /readiness
    - /liveness
    - /metrics
    - /upyog-aggregation-service/health
    - /upyog-aggregation-service/readiness
    - /upyog-aggregation-service/liveness
    - /upyog-aggregation-service/metrics

observability:
  metrics:
    enabled: true
    path: /metrics
    namespace: upyog
    subsystem: aggregation
  tracing:
    enabled: true
    endpoint: "jaeger-collector.observability:4317"
    serviceName: upyog-aggregation-service
    samplingRate: 0.5

providers:
  defaultTimeout: 10s
  maxRetries: 2
  cacheTTL: 5m
  recentApplicationsSinceDays: 7
  completedServiceStatuses:
    - "APPROVE"
    - "APPROVED"
    - "AUTO_APPROVED"
    - "CANCELED"
    - "CANCELLED"
    - "CLOSEDAFTERREJECTION"
    - "CLOSEDAFTERRESOLUTION"
    - "CLOSURE"
    - "COMPLETED"
    - "CONNECTION_ACTIVATED"
    - "DELIVERED"
    - "DISCONNECTION_EXECUTED"
    - "DISPOSED"
    - "EXPIRED"
    - "MANUALEXPIRED"
    - "REFUNDAPPROVED"
    - "REGISTRATIONCOMPLETED"
    - "REJECTED"
    - "REQUESTCOMPLETED"
    - "REQUESTREJECTED"
    - "RESOLVED"
    - "REVOCATED"
    - "TREE_PRUNING_SERVICE_COMPLETED"
    - "VOIDED"
    - "COMPLETE_REQUEST"
    - "COMPLETEREQUEST"
    - "SETTLED"
  custom:
    quick-summary:
      timeout: 15s
      cacheTTL: 2m
      retries: 3
    notifications:
      timeout: 5s
      cacheTTL: 1m
      retries: 1
    new-applications:
      timeout: 8s
      cacheTTL: 1m
      retries: 2

rateLimit:
  enabled: true
  requestsPerSecond: 100
  burst: 200

backend:
  services:
    inbox:
      baseUrl: "http://inbox-service.dev:8080"
      timeout: 10s
      maxConns: 50
      circuitThreshold: 5
      circuitTimeout: 30s
    billing:
      baseUrl: "http://billing-service.dev:8080"
      timeout: 10s
      maxConns: 30
      circuitThreshold: 5
      circuitTimeout: 30s
    property:
      baseUrl: "http://property-services.dev:8080"
      timeout: 10s
      maxConns: 30
      circuitThreshold: 5
      circuitTimeout: 30s
    workflow:
      baseUrl: "http://egov-workflow.dev:8080"
      timeout: 10s
      maxConns: 30
      circuitThreshold: 5
      circuitTimeout: 30s
    tl-services:
      baseUrl: "http://tl-services.dev:8080"
      timeout: 10s
      maxConns: 30
      circuitThreshold: 5
      circuitTimeout: 30s
    user-event:
      baseUrl: "http://egov-user-event.dev:8080"
      timeout: 10s
      maxConns: 30
      circuitThreshold: 5
      circuitTimeout: 30s
    advertisement:
      baseUrl: "http://advertisement-service.dev:8080"
      timeout: 10s
      maxConns: 30
      circuitThreshold: 5
      circuitTimeout: 30s
    draft:
      baseUrl: "http://upyog-draft-service.dev:8080"
      timeout: 10s
      maxConns: 30
      circuitThreshold: 5
      circuitTimeout: 30s
    chb:
      baseUrl: "http://chb-service.dev:8080"
      timeout: 10s
      maxConns: 30
      circuitThreshold: 5
      circuitTimeout: 30s
