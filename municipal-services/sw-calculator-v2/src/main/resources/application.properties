server.port=8084
server.context.path=/sw-calculator-v2
server.servlet.context-path=/sw-calculator-v2
app.timezone=UTC
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/pg
spring.datasource.username=postgres
spring.datasource.password=postgres

##----------------------------- FLYWAY CONFIGURATIONS ------------------------------#
spring.flyway.url=jdbc:postgresql://localhost:5432/pg
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.table=public220
spring.flyway.locations=classpath:/db/migration/ddl
spring.flyway.baseline-on-migrate=true
spring.flyway.outOfOrder=true
spring.flyway.enabled=true

# Billing Service url
egov.billingservice.host=http://localhost:8081
egov.demand.update.endpoint=billing-service-v2/demand/_update
egov.demand.create.endpoint=billing-service-v2/demand/_create
egov.demand.search.endpoint=billing-service-v2/demand/_search
egov.bill.gen.endpoint=billing-service-v2/bill/_generate
egov.bill.fetch.endpoint=/billing-service-v2/bill/v2/_fetchbill
egov.taxhead.search.endpoint=billing-service-v2/taxheads/_search
egov.taxperiod.search.endpoint=billing-service-v2/taxperiods/_search
egov.demand.businessservice=SW
egov.bill.search.endpoint=/billing-service-v2/bill/v2/_search
egov.bill.search.endpoints=/billing-service-v2/bill/v2/_searchv2

# KAFKA SERVER CONFIGURATIONS
kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:egov-sw-calculator-v2}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#SMS Notification
kafka.topics.notification.sms=egov.core.notification.sms
notification.sms.enabled=true
notification.sms.link=citizen/withoutAuth/egov-common/pay?consumerCode=$consumerCode&tenantId=$tenantId&businessService=SW
egov.bill.details.sms.link=digit-ui/citizen/payment/my-bills/SW/$consumerCode?workflow=WNS&tenantId=$tenantId&ConsumerName=$consumerName


#Email Notification
notification.mail.enabled=true
kafka.topics.notification.mail.name=egov.core.notification.email

# Billing Expiry time
egov.demand.billexpirytime=2592000000
sw.module.minpayable.amount=100

#offset and limit configuration
egov.sewerageservice.pagination.default.limit=50
egov.sewerageservice.pagination.default.offset=0

#mdms urls
egov.mdms.host=http://localhost:8094/
egov.mdms.search.endpoint=egov-mdms-service/v1/_search


##----------------------------- WATER AND SEWARAGE URL ------------------------------#
egov.sw.host=http://localhost:8090
egov.sc.search.endpoint=sw-services/swc/_search


#Localization config
egov.localization.host=https://egov-micro-dev.egovernments.org/
egov.localization.workDir.path=localization/messages/v1
egov.localization.context.path=localization/messages/v1
egov.localization.search.endpoint=/_search
egov.localization.statelevel=true

##demand saved and failed topic
sw.calculator.demand.successful.topic=sw-demand-saved-v2
sw.calculator.demand.failed.topic=sw-demand-failed-v2
kafka.topics.save.demand=save-demand
kafka.topics.update.demand=update-demand
sw.demand.generate=sw-demand-generate-success-v2
sw.demand.failed=sw-demand-generate-failure-v2
sw.calculator.bill.successful=sw-bill-generate-failure-v2
sw.calculator.bill.failed=sw-bill-generate-failure-v2
egov.demand.minimum.payable.amount=100

#bill generator scheduler topic
egov.sw.billgenerate.scheduler=save-sw-bill-scheduler-v2
#User config
egov.user.host=http://localhost:8081/
egov.user.context.path=user/users
egov.user.search.path=user/_search

# billgen notif topic 
kafka.topics.billgen.topic=sw-bill-generation-v2
egov.swcalculatorservice.billgenerate.topic=sw-bulk-bill-job-scheduler-v2

#userevents
egov.user.event.notification.enabled=true
egov.ui.app.host=https://egov-micro-dev.egovernments.org/
egov.usr.events.create.topic=persist-user-events-async
egov.usr.events.pay.link=citizen/otpLogin?mobileNo=$mobile&redirectTo=egov-common/pay?consumerCode=$consumerCode&tenantId=$tenantId&businessService=SW
egov.sw.view.history.link=digit-ui/citizen/ws/connection/application/$applicationNumber
egov.usr.events.pay.code=PAY
egov.usr.events.pay.triggers=PENDINGPAYMENT
notification.url = https://dev.digit.org/

sw.demand.based.batch.size=1
egov.seweragecalculatorservice.createdemand.topic=sw-generate-demand-v2
persister.demand.based.dead.letter.topic.batch=sw-dead-letter-topic-batch-v2
persister.demand.based.dead.letter.topic.single=sw-dead-letter-topic-single-v2

#PROPERTY  CONFIGURATIONS
egov.property.service.host=https://egov-micro-dev.egovernments.org/
egov.property.searchendpoint=property-services/property/_search
spring.kafka.consumer.properties.spring.json.use.type.headers=false

#WORKFLOW PROCESS INSTANCE SEARCH CONFIGURATIONS
workflow.workDir.path=http://egov-workflow-v2.egov:8080/
workflow.process.search.path=egov-workflow-v2/egov-wf/process/_search

logging.level.org.egov.swcalculation=DEBUG
egov.shortener.url=egov-url-shortening/shortener

kafka.topics.bulk.bill.generation=bulk-bill-generator-v2
kafka.topics.bulk.bill.generation.audit=bulk-bill-generator-audit-sw-v2
bulk.demand.batch.value=1000
bulk.demand.offset.value=0

egov.internal.microservice.user.uuid=b5b2ac70-d347-4339-98f0-5349ce25f99f

#BULK DEMAND GENERATE COUNT
egov.bulk.save.demand.count=25
egov.bulk.bill.generate.count=10

egov.sw.calculator.concurrency.count=${KAFKA_LISTENER_CONCURRENCY:3}

# sw-calculator-v2 batch logging topics
kafka.topics.save.sw.batch.demand.log=save-sw-demand-log-v2
kafka.topics.save.sw.batch.connection.log=save-sw-connection-log-v2

# Multi-threading: parallel tenant processing (1 thread per tenant, up to this limit)
sw.tenant.thread.pool.size=${SW_TENANT_THREAD_POOL_SIZE:5}

# Multi-threading: parallel connection-partition processing (number of threads inside a tenant)
sw.connection.thread.pool.size=${SW_CONNECTION_THREAD_POOL_SIZE:3}
