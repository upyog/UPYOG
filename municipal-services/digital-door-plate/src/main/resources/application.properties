spring.application.name=digital-door-plate
server.port=${SERVER_PORT:1239}
server.contextPath=/digital-door-plate
server.servlet.context-path=/digital-door-plate

# health check for k8s probes at /digital-door-plate/health
management.endpoints.web.base-path=/

# Application Settings
state.level.tenant.id=hp

app.timezone=Asia/Kolkata
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/hp_udd_dev
spring.datasource.username=postgres
spring.datasource.password=postgres

##----------------------------- FLYWAY CONFIGURATIONS ------------------------------#
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/hp_udd_dev
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.table=digital_door_plate_schema
spring.flyway.locations=classpath:db/migration/ddl
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true

##----------------------------- KAFKA CONFIGURATIONS ------------------------------#
kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=bs-persist
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false

##----------------------------- Kafka Topic config ------------------------------#
kafka.topics.save.garbage.collection=save-ddp-garbage-collection

##----------------------------- garbage service ------------------------------#
egov.garbage.service.host=http://localhost:1235
egov.garbage.account.search.endpoint=/garbage-service/garbage-accounts/_search
egov.garbage.account.update.ddp.workflow.endpoint=/garbage-service/garbage-accounts/_updateDdpWorkflow

##----------------------------- user service ------------------------------#
egov.user.host=http://localhost:8081
egov.user.search.endpoint=/user/_search

##----------------------------- hrms service ------------------------------#
egov.hrms.host=http://localhost:8081
egov.hrms.context.path=/egov-hrms/employees/
egov.hrms.create.path=_create

##----------------------------- secure qr crypto (citizenseva certificate) ------------------------------#
qr.crypto.public.cert.path=/opt/certs/citizenseva/01_EndEntity_wc.citizenseva.hp.gov.in.cer
qr.crypto.private.key.path=/opt/certs/citizenseva/citizenseva.hp.gov.in.key

egov.property.context.host=http://localhost:8282
egov.property.search.endpoint=/property-services/property/_search