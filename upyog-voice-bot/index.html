<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>UPYOG AI Assistant</title>
 <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="/upyog-voice-bot/assets/styles.css">
 
 <style>
 #phone-login-modal {
 position: fixed; top: 0; left: 0; width: 100%; height: 100%;
 background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px);
 -webkit-backdrop-filter: blur(12px);
 display: none; justify-content: center; align-items: center; z-index: 9999;
 }
 .phone-modal-card {
 background: rgba(255, 255, 255, 0.95); border-radius: 24px; padding: 40px;
 text-align: center; max-width: 380px; width: 90%;
 box-shadow: 0 24px 64px rgba(0,0,0,0.2), inset 0 2px 15px rgba(255,255,255,1);
 font-family: 'Outfit', sans-serif;
 }
 .phone-modal-card h2 { font-size: 22px; color: #0f172a; margin-bottom: 10px; font-weight: 700; }
 .phone-modal-card p { font-size: 14px; color: #475569; margin-bottom: 24px; }
 .phone-modal-card input {
 width: 100%; padding: 14px 20px; margin-bottom: 20px; border-radius: 12px;
 border: 1px solid rgba(0,0,0,0.1); font-size: 16px; outline: none;
 text-align: center; letter-spacing: 2px; box-sizing: border-box;
 }
 .phone-modal-card input:focus { border-color: #ea580c; box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.1); }
 .phone-modal-card button {
 width: 100%; padding: 14px; border-radius: 100px; border: none;
 background: linear-gradient(135deg, #ea580c, #f59e0b); color: white;
 font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s;
 font-family: 'Outfit', sans-serif;
 }
 .phone-modal-card button:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(234, 88, 12, 0.3); }
 #login-error { color: #ef4444; font-size: 13px; margin-bottom: 15px; display: none; font-weight: 500; }
 .logout-btn {
 background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.8);
 color: #475569; padding: 6px 16px; border-radius: 100px; cursor: pointer; 
 font-size: 12px; font-weight: 600; margin-right: 12px; backdrop-filter: blur(20px);
 transition: all 0.2s ease;
 }
 .logout-btn:hover { background: #ef4444; color: white; border-color: #ef4444; }
 </style>
</head>

<body>
 <div id="phone-login-modal">
 <div class="phone-modal-card">
 <h2>System Login</h2>
 <p>Enter your 10-digit mobile number to access your account and load context memory.</p>
 <div id="login-error">Invalid phone number.</div>
 <input type="text" id="phone-input" placeholder="e.g. 9876543210" maxlength="10" onkeypress="handleLoginKeyPress(event)">
 <button onclick="handlePhoneLogin()">Access Platform</button>
 </div>
 </div>

 <div id="bg-layers"></div>

 <div class="status-pill" id="status-pill">
 <div class="status-dot idle" id="status-dot"></div>
 <span id="status-text">Ready</span>
 </div>

 <header>
 <h1><span class="logo-icon" id="logo-icon"></span> UPYOG AI</h1>
 <div class="header-controls">
 <button class="logout-btn" onclick="logoutSession()" id="logout-btn" style="display: none;">Logout</button>
 <div class="lang-toggle" id="lang-toggle"></div>
 <button class="settings-toggle" id="settings-toggle"></button>
 </div>
 </header>

 <div id="chat-container">
 <div class="hero-container" id="hero-welcome">
 <div class="hero-tagline">Speak. Ask. Solve.</div>
 <div class="voice-orb"></div>
 <h2 class="hero-title">Smart Voice Assistant</h2>
 <p class="hero-subtitle">Talk naturally and get instant answers, help, and guidance for government services.</p>
 </div>
 </div>

 <div class="bottom-input-bar">
 <div class="speech-preview-wrapper">
 <div id="speech-preview">
 <span class="speech-preview-icon" id="speech-preview-icon"></span>
 <span id="speech-preview-text"></span>
 </div>
 </div>
 
 <div class="input-area" id="input-area-container">
 <input type="text" id="text-input" placeholder="Please login..." disabled autocomplete="off">
 <div class="input-actions">
 <button class="icon-button voice-button start" id="session-toggle-btn" title="Tap to speak" disabled></button>
 <button id="send-text-btn" class="icon-button send-btn" title="Send message" disabled></button>
 </div>
 </div>
 </div>

 <div class="settings-panel" id="settings-panel">
 <h3>Settings</h3>
 <div class="settings-row">
 <label>Barge-in Sensitivity: <span id="sensitivity-value">0.02</span></label>
 <input type="range" id="barge-sensitivity" min="0.01" max="0.05" step="0.01" value="0.02">
 <div class="settings-hint">Lower = more sensitive</div>
 </div>
 <div class="settings-row">
 <label>Language Preference</label>
 <select id="lang-preference"></select>
 </div>
 </div>

 <script src="/upyog-voice-bot/assets/constants.js"></script>
 <script src="/upyog-voice-bot/assets/icons.js"></script>
 <script>
 // ============== REDIS LOGIN LOGIC ==============
  let conversationSessionId = null;

  window.addEventListener('DOMContentLoaded', () => {
  const savedPhone = localStorage.getItem("upyog_redis_phone");
  const modal = document.getElementById("phone-login-modal");
  if (!savedPhone) {
  modal.style.display = "flex";
  setTimeout(() => { document.getElementById("phone-input").focus(); }, 100);
  } else {
  // Retrieve existing active session from sessionStorage to continue the conversation on refresh
  let sessionId = sessionStorage.getItem("upyog_active_session");
  if (!sessionId) {
  sessionId = `user_${savedPhone}_${Math.random().toString(36).substring(2, 9)}`;
  sessionStorage.setItem("upyog_active_session", sessionId);
  }
  activateUser(sessionId);
  }
  });

  function handleLoginKeyPress(event) {
  if (event.key === "Enter") handlePhoneLogin();
  }

  function handlePhoneLogin() {
  const phoneInput = document.getElementById("phone-input");
  const phone = phoneInput.value.trim();
  const errorText = document.getElementById("login-error");
  const phoneRegex = /^[0-9]{10}$/;
  
  if (!phoneRegex.test(phone)) {
  errorText.style.display = "block";
  return;
  }
  errorText.style.display = "none";
  
  localStorage.setItem("upyog_redis_phone", phone);
  
  const sessionId = `user_${phone}_${Math.random().toString(36).substring(2, 9)}`;
  sessionStorage.setItem("upyog_active_session", sessionId);
  document.getElementById("phone-login-modal").style.display = "none";
  activateUser(sessionId);
  }

  function activateUser(sessionId) {
  conversationSessionId = sessionId;
  console.log("Memory active for session:", conversationSessionId);
  
  // Unlock UI Elements
  document.getElementById("text-input").disabled = false;
  document.getElementById("text-input").placeholder = "Ask anything about UPYOG services...";
  document.getElementById("session-toggle-btn").disabled = false;
  document.getElementById("send-text-btn").disabled = false;
  document.getElementById("logout-btn").style.display = "inline-block";
  
  // Note: UI stays clean. Backend natively pulls history from Redis for AI context.
  }

  function logoutSession() {
  localStorage.removeItem("upyog_redis_phone");
  sessionStorage.removeItem("upyog_active_session");
  window.location.reload();
  }

 // ============== STATE ==============
 let currentState = States.IDLE;
 let sessionActive = false;
 let currentLang = 'auto';
 let recognition = null;
 let currentAudio = null;
 let currentFetch = null;

 let turnCount = 0;
 let lastDetectedLang = 'en';
 let currentTranscript = '';
 let finalTranscript = '';
 let silenceTimer = null;
 let forceTimer = null;

 const audioPool = [];
 let analyser = null;
 let micStream = null;
 let bargeInThreshold = CONFIG.bargeInThreshold;
 let voiceFrames = 0;

 const chatContainer = document.getElementById('chat-container');
 const statusDot = document.getElementById('status-dot');
 const statusText = document.getElementById('status-text');
 const sessionBtn = document.getElementById('session-toggle-btn');
 const interimDisplay = document.getElementById('speech-preview');
 const interimText = document.getElementById('speech-preview-text');
 const settingsToggle = document.getElementById('settings-toggle');
 const settingsPanel = document.getElementById('settings-panel');
 const bargeSensitivity = document.getElementById('barge-sensitivity');
 const sensitivityValue = document.getElementById('sensitivity-value');

 let API_URL = window.location.origin;
 if (window.location.pathname.includes('/upyog-voice-bot')) {
 API_URL += '/upyog-voice-bot';
 } else if (window.location.pathname.includes('/upyog-voice')) {
 API_URL += '/upyog-voice';
 }

 let NIAUTT_REQUEST_INFO = {};
 function handleNiuattMessage(event) {
 if (event.origin !== CONFIG.niuattOrigin) return;
 if (event.data?.type === "INIT_DATA") {
 NIAUTT_REQUEST_INFO = event.data.RequestInfo || {};
 }
 }
 window.addEventListener("message", handleNiuattMessage);

  const getRequestInfo = () => {
    const info = { ...NIAUTT_REQUEST_INFO, msgId: `${Date.now()}|en_IN` };
    const savedPhone = localStorage.getItem("upyog_redis_phone");
    if (savedPhone && savedPhone.length === 10 && /^\d+$/.test(savedPhone)) {
      info.authToken = savedPhone;
    }
    return info;
  };

 function setState(newState) {
 currentState = newState;
 if (newState === States.SPEAKING) {
 statusDot.className = 'status-dot speaking';
 statusDot.innerHTML = ICONS.speakingWave;
 } else {
 statusDot.className = 'status-dot ' + newState.toLowerCase();
 statusDot.innerHTML = '';
 }
 statusText.innerText = STATE_LABELS[newState];
 }

 document.querySelectorAll('.lang-btn').forEach(btn => {
 btn.addEventListener('click', function handleLangBtnClick() {
 document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
 btn.classList.add('active');
 currentLang = btn.dataset.lang;
 });
 });

 function toggleSettingsPanel() { settingsPanel.classList.toggle('show'); }
 settingsToggle.addEventListener('click', toggleSettingsPanel);

 function updateBargeSensitivity(e) {
 bargeInThreshold = parseFloat(e.target.value);
 sensitivityValue.innerText = bargeInThreshold.toFixed(2);
 }
 bargeSensitivity.addEventListener('input', updateBargeSensitivity);

 function syncLangPreference(e) {
 currentLang = e.target.value;
 document.querySelectorAll('.lang-btn').forEach(btn => {
 btn.classList.toggle('active', btn.dataset.lang === currentLang);
 });
 }
 document.getElementById('lang-preference').addEventListener('change', syncLangPreference);

 function showTextInputBar(field) {
 const input = document.getElementById('text-input');
 input.placeholder = FIELD_PLACEHOLDERS[field] || FIELD_PLACEHOLDERS.default;
 setTimeout(() => input.focus(), 500);
 }

 function removeTextInputBar() {
 const input = document.getElementById('text-input');
 if (input) input.placeholder = 'Ask anything about UPYOG services...';
 }

 function addUserMessage(text) {
 const hero = document.getElementById('hero-welcome');
 if (hero) hero.classList.add('hidden');
 
 const rowDiv = document.createElement('div');
 rowDiv.className = 'message-row user-row';
 const msgDiv = document.createElement('div');
 msgDiv.className = 'message user';
 msgDiv.innerText = text;
 const avatarDiv = document.createElement('div');
 avatarDiv.className = 'user-avatar';
 avatarDiv.innerHTML = ICONS.avatar;
 
 rowDiv.appendChild(msgDiv);
 rowDiv.appendChild(avatarDiv);
 chatContainer.appendChild(rowDiv);
 chatContainer.scrollTop = chatContainer.scrollHeight;
 }

 function addBotMessage(text, mode, inputType, options, field) {
 const hero = document.getElementById('hero-welcome');
 if (hero) hero.classList.add('hidden');
 if (mode !== 'grievance_collecting') removeTextInputBar();

 const wrapper = document.createElement('div');
 wrapper.className = 'message-wrapper bot';
 const bubble = document.createElement('div');
 bubble.className = 'message bot';
 if (mode === 'grievance_collecting') bubble.classList.add('grievance-collecting');
 if (mode === 'grievance_offered') bubble.classList.add('grievance-offered');
 bubble.textContent = text;
 wrapper.appendChild(bubble);

 if (inputType === 'choice' && options && options.length > 0) {
 if (options.length > 6) {
 const selectWrapper = document.createElement('div');
 selectWrapper.className = 'choice-dropdown-wrapper';
 const select = document.createElement('select');
 select.className = 'choice-select';
 const defaultOpt = document.createElement('option');
 defaultOpt.value = ''; defaultOpt.textContent = '-- Select an option --'; defaultOpt.disabled = true; defaultOpt.selected = true;
 select.appendChild(defaultOpt);
 options.forEach(opt => {
 const o = document.createElement('option'); o.value = opt; o.textContent = opt; select.appendChild(o);
 });
 const confirmBtn = document.createElement('button');
 confirmBtn.textContent = 'Confirm'; confirmBtn.className = 'choice-confirm-btn';
 confirmBtn.onclick = function handleConfirmSelection() {
 if (!select.value) return;
 select.disabled = true; confirmBtn.disabled = true;
 sendQuery(select.value);
 };
 selectWrapper.appendChild(select); selectWrapper.appendChild(confirmBtn);
 wrapper.appendChild(selectWrapper);
 } else {
 const btnContainer = document.createElement('div');
 btnContainer.className = 'choice-pill-container';
 options.forEach(opt => {
 const btn = document.createElement('button');
 btn.textContent = opt; btn.className = 'choice-pill-btn';
 btn.onclick = function handleChoiceBtnClick() {
 btnContainer.querySelectorAll('button').forEach(b => { b.disabled = true; });
 btn.classList.add('selected');
 sendQuery(opt);
 };
 btnContainer.appendChild(btn);
 });
 wrapper.appendChild(btnContainer);
 }
 const hint = document.createElement('div');
 hint.className = 'choice-hint'; hint.textContent = HINT_MESSAGES.speakChoice;
 wrapper.appendChild(hint);
 }
 if (inputType === 'number') {
 const hint = document.createElement('div');
 hint.className = 'number-hint'; hint.textContent = HINT_MESSAGES.speakDigits;
 wrapper.appendChild(hint);
 showTextInputBar(field);
 }
 if (inputType === 'text') showTextInputBar(field);
 chatContainer.appendChild(wrapper);
 chatContainer.scrollTop = chatContainer.scrollHeight;
 }

 function destroyRecognition() {
 if (recognition) {
 recognition.onstart = null; recognition.onresult = null; recognition.onspeechend = null;
 recognition.onend = null; recognition.onerror = null;
 try { recognition.abort(); } catch(e) {}
 recognition = null;
 }
 }

 function createRecognition(lang) {
 destroyRecognition();
 const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
 if (!SR) { alert('Speech recognition not supported in this browser'); return null; }

 recognition = new SR();
 recognition.continuous = true; recognition.interimResults = true; recognition.maxAlternatives = 1;
 recognition.lang = lang === 'hi' ? 'hi-IN' : 'en-IN';

 recognition.onstart = function onRecognitionStart() { setState(States.LISTENING); };
 recognition.onresult = handleResult;
 recognition.onspeechend = handleSpeechEnd;
 recognition.onend = function onRecognitionEnd() {
 if (sessionActive && currentState === States.LISTENING) {
 setTimeout(() => { if (sessionActive && recognition) { try { recognition.start(); } catch(e) {} } }, 100);
 }
 };
 recognition.onerror = function onRecognitionError(e) {
 if (e.error === 'no-speech' || e.error === 'aborted') return;
 setTimeout(() => { if (sessionActive) { createRecognition(lastDetectedLang); try { recognition.start(); } catch(e) {} } }, 500);
 };
 return recognition;
 }

 function createAndStartRecognition() {
 const lang = lastDetectedLang || 'en';
 createRecognition(lang);
 if (recognition) {
 try { recognition.start(); } catch(e) { addBotMessage('Sorry, microphone could not start.', null, null, null, null); }
 }
 }

 function handleResult(event) {
 clearTimeout(silenceTimer); clearTimeout(forceTimer);
 let interim = ''; let newFinal = '';
 for (let i = event.resultIndex; i < event.results.length; i++) {
 const transcript = event.results[i][0].transcript;
 if (event.results[i].isFinal) newFinal += transcript + ' ';
 else interim += transcript;
 }
 if (newFinal) finalTranscript += newFinal;
 const displayText = finalTranscript + interim;
 if (displayText) {
 interimText.innerText = displayText;
 interimDisplay.classList.add('show');
 }
 const textToSend = finalTranscript.trim() || interim.trim();
 if (textToSend) {
 silenceTimer = setTimeout(() => { attemptSend(textToSend); }, CONFIG.silenceWaitMs);
 if (!forceTimer) { forceTimer = setTimeout(() => { if (textToSend) attemptSend(textToSend); }, CONFIG.forceSendMs); }
 }
 }

 function handleSpeechEnd() {}

 function attemptSend(text) {
 clearTimeout(silenceTimer); clearTimeout(forceTimer);
 const words = text.trim().split(/\s+/);
 if (words.length < CONFIG.minWordsToSend) return;
 try { recognition.stop(); } catch(e) {}
 finalTranscript = ''; currentTranscript = '';
 sendQuery(text.trim());
 }

 function onTurnComplete() {
 turnCount++; finalTranscript = ''; currentTranscript = '';
 clearTimeout(silenceTimer); clearTimeout(forceTimer);
 silenceTimer = null; forceTimer = null;
 if (!sessionActive) return;
 if (turnCount % 5 === 0) { destroyRecognition(); createRecognition(lastDetectedLang); }
 if (recognition) {
 try { recognition.start(); setState(States.LISTENING); } 
 catch(e) {
 if (e.name === 'InvalidStateError') setState(States.LISTENING);
 else { setTimeout(() => { if (sessionActive) { destroyRecognition(); createRecognition(lastDetectedLang); recognition.start(); setState(States.LISTENING); } }, 300); }
 }
 }
 }

 async function startBargeInMonitor() {
 try {
 micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
 const audioCtx = new AudioContext();
 const source = audioCtx.createMediaStreamSource(micStream);
 analyser = audioCtx.createAnalyser(); analyser.fftSize = 512; source.connect(analyser);
 const buffer = new Float32Array(analyser.fftSize);

 function checkVolume() {
 if (!sessionActive) return;
 analyser.getFloatTimeDomainData(buffer);
 const rms = Math.sqrt(buffer.reduce((s, v) => s + v * v, 0) / buffer.length);
 if (currentState === States.SPEAKING) {
 if (rms > bargeInThreshold) {
 voiceFrames++;
 if (voiceFrames > 8) { triggerBargeIn(); voiceFrames = 0; requestAnimationFrame(checkVolume); return; }
 } else { voiceFrames = 0; }
 } else { voiceFrames = 0; }
 requestAnimationFrame(checkVolume);
 }
 checkVolume();
 } catch(e) {}
 }

 function triggerBargeIn() {
 if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio.src = ''; currentAudio = null; }
 if (currentFetch) { currentFetch.abort(); currentFetch = null; }
 fetch(`${API_URL}/stop`, { method: 'POST' }).catch(() => {});

 finalTranscript = ''; currentTranscript = '';
 clearTimeout(silenceTimer); clearTimeout(forceTimer); silenceTimer = null; forceTimer = null;
 destroyRecognition();
 setState('LISTENING');
 clearInterimDisplay();
 setTimeout(() => { if (sessionActive) { createRecognition(lastDetectedLang); try { recognition.start(); } catch(e) {} } }, 300);
 }

 function clearInterimDisplay() { if (interimDisplay) { interimDisplay.classList.remove('show'); interimText.innerText = ''; } }

 async function sendQuery(transcript) {
 if (!transcript.trim() || !conversationSessionId) return;
 setState(States.PROCESSING);
 clearInterimDisplay();
 if (currentFetch) { currentFetch.abort(); currentFetch = null; }
 addUserMessage(transcript);
 currentFetch = new AbortController();

 try {
 const response = await fetch(`${API_URL}/chat`, {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({
 RequestInfo: getRequestInfo(),
 query: transcript,
 session_id: conversationSessionId
 }),
 signal: currentFetch.signal
 });

 const data = await response.json();
 currentFetch = null;

 const inputArea = document.querySelector('.input-area');
 if (inputArea) {
 const isGrievance = data.mode === 'grievance' || data.mode === 'grievance_collecting' || data.mode === 'grievance_offered';
 inputArea.classList.toggle('input-area--grievance', isGrievance);
 }

 if (data.error) {
 addBotMessage('Sorry, an error occurred.', null, null, null, null);
 setState(States.LISTENING); onTurnComplete(); return;
 }

 const detectedLang = data.lang || 'en';
 lastDetectedLang = detectedLang;
 if (recognition) recognition.lang = detectedLang === 'hi' ? 'hi-IN' : 'en-IN';

 addBotMessage(data.response, data.mode, data.input_type, data.options, data.field);
 if (data.audio) { playAudio(data.audio); } else { setState(States.LISTENING); onTurnComplete(); }

 } catch (error) {
 if (error.name !== 'AbortError') addBotMessage('Sorry, connection failed.', null, null, null, null);
 setState(States.LISTENING); currentFetch = null; onTurnComplete();
 }
 }

 async function playAudio(base64) {
 setState(States.SPEAKING);
 try {
 if (currentAudio) { currentAudio.pause(); currentAudio.src = ''; currentAudio.load(); currentAudio = null; }
 audioPool.forEach(url => { try { URL.revokeObjectURL(url); } catch(e) {} });
 audioPool.length = 0;

 const mimeType = base64.startsWith('//O') || base64.startsWith('SUQz') ? 'audio/mp3' : 'audio/wav';
 const byteCharacters = atob(base64); const byteNumbers = new Array(byteCharacters.length);
 for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
 const byteArray = new Uint8Array(byteNumbers); const blob = new Blob([byteArray], { type: mimeType });
 const url = URL.createObjectURL(blob); audioPool.push(url);

 const audio = currentAudio = new Audio(url);
 let audioHandled = false;

 audio.onended = function onAudioEnded() {
 if (audioHandled) return; audioHandled = true;
 URL.revokeObjectURL(url); currentAudio = null;
 setState(States.LISTENING); onTurnComplete();
 };
 audio.onerror = function onAudioError() {
 if (audioHandled) return; audioHandled = true;
 URL.revokeObjectURL(url); currentAudio = null;
 if (audio.currentTime > 0) { setState(States.LISTENING); onTurnComplete(); } 
 else { addBotMessage('Sorry, could not play audio.', null, null, null, null); setState(States.LISTENING); onTurnComplete(); }
 };
 await currentAudio.play();
 } catch(e) { setState(States.LISTENING); onTurnComplete(); }
 }

 async function handleSessionToggle() {
 if (sessionActive) {
 sessionActive = false;
 sessionBtn.innerText = 'Start Session'; sessionBtn.classList.remove('end'); sessionBtn.classList.add('start');
 clearTimeout(silenceTimer); clearTimeout(forceTimer); destroyRecognition();
 if (currentAudio) { currentAudio.pause(); currentAudio.src = ''; currentAudio = null; }
 if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
 setState(States.IDLE);
 } else {
 sessionActive = true;
 sessionBtn.innerText = 'End Session'; sessionBtn.classList.remove('start'); sessionBtn.classList.add('end');
 turnCount = 0; finalTranscript = ''; currentTranscript = '';
 try { createAndStartRecognition(); startBargeInMonitor(); setState(States.LISTENING); } 
 catch(e) { sessionActive = false; setState(States.IDLE); }
 }
 }
 sessionBtn.addEventListener('click', handleSessionToggle);

 const textInput = document.getElementById('text-input');
 const sendTextBtn = document.getElementById('send-text-btn');
 function handleTextSubmit() {
 const text = textInput.value.trim();
 if (!text) return;
 sendQuery(text);
 textInput.value = '';
 }
 sendTextBtn.addEventListener('click', handleTextSubmit);
 textInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleTextSubmit(); });
 </script>
</body>
</html>
