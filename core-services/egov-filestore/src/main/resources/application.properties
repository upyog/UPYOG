# =============================================================================
# File Upload Size Configuration by File Type (in bytes)
# =============================================================================
# Global default upload size limit for general files (default: 10 MB = 10485760 bytes)
file.upload.max.size.bytes=10485760

# Maximum size allowed for PDF files (default: 10 MB = 10485760 bytes)
pdf.upload.max.size.bytes=10485760

# Maximum size allowed for Image files: jpg, jpeg, png (default: 5 MB = 5242880 bytes)
image.upload.max.size.bytes=5242880

# Maximum size allowed for Document files: doc, docx, xls, xlsx, txt, csv, ods, odt, dxf (default: 10 MB = 10485760 bytes)
document.upload.max.size.bytes=10485760

# Maximum size allowed for direct Audio/Video Media uploads (default: 100 MB = 104857600 bytes)
media.upload.max.size.bytes=104857600

management.endpoints.web.base-path=/


