logging.pattern.console=%clr(%X{CORRELATION_ID:-}) %clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}
logging.level.org.springframework=


#Paramters for naming file for internal storage
filename.length=10
filename.useletters=true
filename.usenumbers=false

#Spring Boot 3.x Compatibility Fix for Multipart File Uploads
#WHY: Spring Boot 3.x has stricter multipart handling than 2.x. When TracerFilter
#tries to process multipart requests, Spring's message converter selection attempts
#to bind the request to Map<?, ?>, causing UnsupportedMediaTypeException.
#SOLUTION: Skip TracerFilter for the file upload endpoint to allow direct processing
#by Spring's MultipartResolver, avoiding the converter selection issue.
tracer.filterSkipPattern=/api-docs.*|/autoconfig|/configprops|/dump|/health|/info|/metrics.*|/mappings|/swagger.*|.*\\.png|.*\\.css|.*\\.js|.*\\.html|/favicon.ico|/hystrix.stream|/prometheus|/manage/*|/v1/files
