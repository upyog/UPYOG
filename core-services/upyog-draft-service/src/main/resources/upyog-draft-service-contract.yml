swagger: 2.0
info:
  version: 1.0.0
  title: UpyogDraftService Service
  description: |
    This service provides APIs for the upyog-draft-service module in the UPYOG platform.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /upyog-draft-service
x-api-id: org.egov.upyog.draft.service
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /draft/v1/_count:
    post:
      summary: Count draft v1
      description: Count draft v1 for upyog-draft-service. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Count draft v1 completed successfully
          schema:
            $ref: "#/definitions/DraftResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Draft
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/DraftResponse"
  /draft/v1/_delete:
    post:
      summary: Delete draft v1
      description: Delete draft v1 for upyog-draft-service. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Delete draft v1 completed successfully
          schema:
            $ref: "#/definitions/DraftResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Draft
      parameters:
        - name: DraftResponse
          in: body
          description: Request payload with RequestInfo and domain data for delete draft v1
          required: True
          schema:
            $ref: "#/definitions/DraftResponse"
  /draft/v1/_markSubmitted:
    post:
      summary: Marksubmitted
      description: Marksubmitted for upyog-draft-service. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Marksubmitted completed successfully
          schema:
            $ref: "#/definitions/DraftResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Draft
      parameters:
        - name: DraftResponse
          in: body
          description: Request payload with RequestInfo and domain data for marksubmitted
          required: True
          schema:
            $ref: "#/definitions/DraftResponse"
  /draft/v1/_save:
    post:
      summary: Save
      description: Save for upyog-draft-service. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Save completed successfully
          schema:
            $ref: "#/definitions/DraftResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Draft
      parameters:
        - name: DraftResponse
          in: body
          description: Request payload with RequestInfo and domain data for save
          required: True
          schema:
            $ref: "#/definitions/DraftResponse"
  /draft/v1/_search:
    post:
      summary: Search draft v1
      description: Search draft v1 for upyog-draft-service. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Search draft v1 completed successfully
          schema:
            $ref: "#/definitions/DraftResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Draft
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/DraftResponse"
definitions:
  DraftResponse:
    type: object
    description: Request/Response contract for DraftResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      UpyogDraftApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/UpyogDraftApplication"
  UpyogDraftApplication:
    type: object
    description: A domain application object for upyog-draft-service
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
