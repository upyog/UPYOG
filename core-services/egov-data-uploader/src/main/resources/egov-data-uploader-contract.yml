swagger: 2.0
info:
  version: 1.0.0
  title: EgovDataUploader Service
  description: |
    Bulk data upload job service.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /egov-data-uploader
x-api-id: org.egov.egov.data.uploader
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /v1jobs/_create:
    post:
      summary: Create v1jobs
      description: Create v1jobs for egov-data-uploader. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Create v1jobs completed successfully
          schema:
            $ref: "#/definitions/Object"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1Jobs
      parameters:
        - name: Object
          in: body
          description: Request payload with RequestInfo and domain data for create v1jobs
          required: True
          schema:
            $ref: "#/definitions/Object"
  /v1jobs/_search:
    post:
      summary: Search v1jobs
      description: Search v1jobs for egov-data-uploader. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Search v1jobs completed successfully
          schema:
            $ref: "#/definitions/Object"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1Jobs
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/Object"
  /v1upload-definitions/_search:
    post:
      summary: Search v1upload-definitions
      description: Search v1upload-definitions for egov-data-uploader. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Search v1upload-definitions completed successfully
          schema:
            $ref: "#/definitions/Object"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1Upload Definitions
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/Object"
  /v1upload-definitions/_test:
    post:
      summary: Definitiontest
      description: Definitiontest for egov-data-uploader. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Definitiontest completed successfully
          schema:
            $ref: "#/definitions/Object"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - V1Upload Definitions
      parameters:
        - name: Object
          in: body
          description: Request payload with RequestInfo and domain data for definitiontest
          required: True
          schema:
            $ref: "#/definitions/Object"
definitions:
  Object:
    type: object
    description: Request/Response contract for Object
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      EgovDataUploadApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/EgovDataUploadApplication"
  EgovDataUploadApplication:
    type: object
    description: A domain application object for egov-data-uploader
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
