swagger: 2.0
info:
  version: 1.0.0
  title: AuditService Service
  description: |
    Audit log ingestion and query service.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /audit-service
x-api-id: org.egov.audit.service
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /log/v1/_create:
    post:
      summary: Create log v1
      description: Create log v1 for audit-service. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Create log v1 completed successfully
          schema:
            $ref: "#/definitions/AuditLogResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Log
      parameters:
        - name: AuditLogResponse
          in: body
          description: Request payload with RequestInfo and domain data for create log v1
          required: True
          schema:
            $ref: "#/definitions/AuditLogResponse"
  /log/v1/_search:
    post:
      summary: Search log v1
      description: Search log v1 for audit-service. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Search log v1 completed successfully
          schema:
            $ref: "#/definitions/AuditLogResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Log
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/AuditLogResponse"
  /log/v1/_test:
    post:
      summary: Testnewauditflow
      description: Testnewauditflow for audit-service. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Testnewauditflow completed successfully
          schema:
            $ref: "#/definitions/Object"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Log
      parameters:
        - name: Object
          in: body
          description: Request payload with RequestInfo and domain data for testnewauditflow
          required: True
          schema:
            $ref: "#/definitions/Object"
  /log/v1/_verify:
    post:
      summary: Verify
      description: Verify for audit-service. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Verify completed successfully
          schema:
            $ref: "#/definitions/ResponseInfo"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Log
      parameters:
        - name: ResponseInfo
          in: body
          description: Request payload with RequestInfo and domain data for verify
          required: True
          schema:
            $ref: "#/definitions/ResponseInfo"
definitions:
  ResponseInfo:
    type: object
    description: Request/Response contract for ResponseInfo
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      AuditApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/AuditApplication"
  AuditLogResponse:
    type: object
    description: Request/Response contract for AuditLogResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      AuditApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/AuditApplication"
  Object:
    type: object
    description: Request/Response contract for Object
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      AuditApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/AuditApplication"
  AuditApplication:
    type: object
    description: A domain application object for audit-service
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
