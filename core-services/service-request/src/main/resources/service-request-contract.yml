swagger: 2.0
info:
  version: 1.0.0
  title: ServiceRequest Service
  description: |
    Generic service request and service definition framework.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /service-request
x-api-id: org.egov.service.request
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /service/definition/v1/_create:
    post:
      summary: Create service definition v1
      description: Create service definition v1 for service-request. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Create service definition v1 completed successfully
          schema:
            $ref: "#/definitions/ServiceDefinitionResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Service
      parameters:
        - name: ServiceDefinitionResponse
          in: body
          description: Request payload with RequestInfo and domain data for create service definition v1
          required: True
          schema:
            $ref: "#/definitions/ServiceDefinitionResponse"
  /service/definition/v1/_search:
    post:
      summary: Search service definition v1
      description: Search service definition v1 for service-request. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Search service definition v1 completed successfully
          schema:
            $ref: "#/definitions/ServiceDefinitionResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Service
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/ServiceDefinitionResponse"
  /service/definition/v1/_update:
    post:
      summary: Update service definition v1
      description: Update service definition v1 for service-request. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Update service definition v1 completed successfully
          schema:
            $ref: "#/definitions/ServiceDefinitionResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Service
      parameters:
        - name: ServiceDefinitionResponse
          in: body
          description: Request payload with RequestInfo and domain data for update service definition v1
          required: True
          schema:
            $ref: "#/definitions/ServiceDefinitionResponse"
  /service/v1/_create:
    post:
      summary: Create service v1
      description: Create service v1 for service-request. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Create service v1 completed successfully
          schema:
            $ref: "#/definitions/ServiceResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Service
      parameters:
        - name: ServiceResponse
          in: body
          description: Request payload with RequestInfo and domain data for create service v1
          required: True
          schema:
            $ref: "#/definitions/ServiceResponse"
  /service/v1/_search:
    post:
      summary: Search service v1
      description: Search service v1 for service-request. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Search service v1 completed successfully
          schema:
            $ref: "#/definitions/ServiceResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Service
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/ServiceResponse"
  /service/v1/_update:
    post:
      summary: Update service v1
      description: Update service v1 for service-request. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Update service v1 completed successfully
          schema:
            $ref: "#/definitions/ServiceResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Service
      parameters:
        - name: ServiceResponse
          in: body
          description: Request payload with RequestInfo and domain data for update service v1
          required: True
          schema:
            $ref: "#/definitions/ServiceResponse"
definitions:
  ServiceResponse:
    type: object
    description: Request/Response contract for ServiceResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      ServiceRequestApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/ServiceRequestApplication"
  ServiceDefinitionResponse:
    type: object
    description: Request/Response contract for ServiceDefinitionResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      ServiceRequestApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/ServiceRequestApplication"
  ServiceRequestApplication:
    type: object
    description: A domain application object for service-request
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
