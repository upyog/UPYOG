server.contextPath=/load-generator
server.servlet.context-path=/load-generator
server.port=8290
app.timezone=UTC

# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgres:5432/postgres
spring.datasource.username=atul
spring.datasource.password=postgres
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Thread pool config
load.generator.thread.pool.size=20
load.generator.batch.size=100
load.generator.retry.max.attempts=3
load.generator.retry.delay.ms=500
load.generator.webclient.timeout.seconds=120

# Auth
egov.internal.auth.token=de463afc-3853-46d9-91f6-602e29ea5508
egov.user.uuid=cd296c40-860f-4335-b582-7cf7fa94df37
egov.user.id=4352

# PGR
egov.pgr.host=http://pgr:8080
egov.pgr.create.endpoint=/pgr-services/v2/requests/_create

# TL
egov.tl.host=http://tl:8080
egov.tl.create.endpoint=/tl-services/v1/TRAD/_create

# PT
egov.pt.host=http://pt:8080
egov.pt.create.endpoint=/property-services/property/_create
egov.pt.update.endpoint=/property-services/property/_update
egov.pt.search.endpoint=/property-services/property/_search

# WS
egov.ws.host=http://ws:8080
egov.ws.create.endpoint=/ws-services/wc/_create

# SW
egov.sw.host=http://sw:8080
egov.sw.create.endpoint=/sw-services/swc/_create

# SV
egov.sv.host=http://sv:8080
