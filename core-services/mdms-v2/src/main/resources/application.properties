server.port=8288

server.context-path=/mdms-v2
server.servlet.context-path=/mdms-v2
management.endpoints.web.base-path=/
app.timezone=UTC

#DATABASE CONFIGURATION
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/V2
spring.datasource.username=atul
spring.datasource.password=postgres

#FLYWAY CONFIGURATION
spring.flyway.url=jdbc:postgresql://localhost:5432/V2
spring.flyway.user=atul
spring.flyway.password=postgres
spring.flyway.table=public
spring.flyway.baseline-on-migrate=true
spring.flyway.outOfOrder=true
spring.flyway.locations=classpath:/db/migration/main
spring.flyway.enabled=false

workflow.host=http://localhost:8080
theme.config.workflow.business.service=THEME_CONFIG

# KAFKA SERVER CONFIGURATIONS
kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=mdms
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# TOPICS
egov.mdms.schema.definition.save.topic=save-mdms-schema-definition
egov.mdms.data.save.topic=save-mdms-data
egov.mdms.data.update.topic=update-mdms-data
egov.mdms.data.delete.topic=delete-mdms-data
egov.mdms.schema.delete.topic=delete-mdms-schema
mdms.default.offset=0
mdms.default.limit=10

# Theme Configuration Topics
egov.mdms.theme.config.save.topic=save-theme-config
egov.mdms.theme.config.staging.save.topic=save-theme-config-staging
egov.mdms.theme.config.staging.update.topic=update-theme-config-staging

logging.level.org.springframework.aop=DEBUG
egov.mdms.theme.config.status.update.topic=update-theme-config-status

update-theme-config-status=update-theme-config-status

workflow.transition.endpoint=/egov-workflow-v2/egov-wf/process/_transition
