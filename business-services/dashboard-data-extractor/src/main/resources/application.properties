spring.application.name=dashboard-data-extractor

server.context-path=/dashboard-data-extractor
server.servlet.context-path=/dashboard-data-extractor
server.port=9999
app.timezone=UTC

# Active profile: defaults to local, can be overridden via SPRING_PROFILES_ACTIVE in Helm/DevOps
spring.profiles.active=qa

# ============================================================================
# DATASOURCE & FLYWAY MIGRATION
# ============================================================================
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.table=as_schema_version
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.outOfOrder=true
spring.flyway.locations=classpath:/db/migration/main

#User config
egov.user.host=http://localhost:8080/
egov.user.context.path=user/users/
egov.user.create.path=_createnovalidate
egov.user.search.path=user/_search
egov.user.update.path=_updatenovalidate


# Environment-specific configurations (credentials, ingestion URLs, and metric context)
# have been moved to application-{env}.properties (e.g., application-local.properties, application-qa.properties)


# ============================================================================
# KAFKA CONFIGURATION
# ============================================================================
dashboard-data.persister.enabled=true
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=dashboard-data-extractor
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false

kafka.consumer.config.auto_commit=true
kafka.consumer.config.auto_commit_interval=100
kafka.consumer.config.session_timeout=15000
kafka.consumer.config.auto_offset_reset=earliest

kafka.producer.config.retries_config=0
kafka.producer.config.batch_size_config=16384
kafka.producer.config.linger_ms_config=1
kafka.producer.config.buffer_memory_config=33554432

kafka.topics.save.ingestion.detail=save-dashboard-ingestion-detail
kafka.topics.save.module.ingestion.detail=save-dashboard-data-module-ingestion-detail
kafka.topics.update.module.ingestion.detail=update-dashboard-data-module-ingestion-detail
kafka.topics.save.dashboard-data.error.log=save-dashboard-data-error-log
kafka.topics.update.dashboard-data.module.summary=update-dashboard-module-summary

# ============================================================================
# LOGGING & DYNAMIC SCHEMA MAPPING
# ============================================================================
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
logging.level.org.egov.tracer=WARN
extractor.enabled-modules=PT,PGR,CHB

# ============================================================================
# DASHBOARD-DATA RETRY AND TIMEOUT PROPERTIES
# ============================================================================
dashboard-data.oauth-retry.max-attempts=3
dashboard-data.oauth-retry.base-delay-ms=1000
dashboard-data.oauth-retry.max-delay-ms=5000

dashboard-data.retry.enabled=false
dashboard-data.retry.max-attempts=3
dashboard-data.retry.base-delay-ms=1000
dashboard-data.retry.max-delay-ms=5000

# State-specific usage categories for Property Tax (PT)
dashboard-data.pt.usage-categories=RESIDENTIAL,COMMERCIAL,INDUSTRIAL
dashboard-data.chb.usage-categories=Approved,Rejected,Cancelled
dashboard-data.chb.booking-mode=Online,Offline

# State-specific Tax Heads mappings
dashboard-data.pt.tax-heads.tax=PT_TAX
dashboard-data.pt.tax-heads.cess=PT_FIRE_CESS,PT_CANCER_CESS
dashboard-data.pt.tax-heads.rebate=PT_TIME_REBATE,PT_ADHOC_REBATE
dashboard-data.pt.tax-heads.penalty=PT_TIME_PENALTY,PT_ADHOC_PENALTY
dashboard-data.pt.tax-heads.interest=PT_TIME_INTEREST

# State-specific digital payment modes
dashboard-data.pt.digital-payment-modes=ONLINE,CARD

# Database query retry config
dashboard-data.db-retry.max-attempts=3
dashboard-data.db-retry.base-delay-ms=1000
dashboard-data.db-retry.max-delay-ms=5000

# Daily catch-up limit (in days)
dashboard-data.daily.catch-up-limit-days=7

# Ingestion batch size for HTTP and audit persistence
dashboard-data.ingestion.batch-size=10

# Dedicated legacy batch size for bulk DB historical extraction & Excel generation
dashboard-data.legacy.batch-size=500
dashboard-data.legacy.keep-excel-file=true

# Fallback property placeholder for engine bean compatibility
dashboard-data.metric.ulb=
state.level.tenant.id=pg

# Timeout Configuration Flag & Durations (Point 1)
dashboard-data.timeout.enabled=true
dashboard-data.timeout.connect-ms=5000
dashboard-data.timeout.read-ms=15000

# Spring Cloud OpenFeign Client Timeouts
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=15000
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=15000

# ============================================================================
# ACTUATOR & HEALTH PROBES
# ============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always

