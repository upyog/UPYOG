swagger: 2.0
info:
  version: 1.0.0
  title: DashboardDataExtractor Service
  description: |
    This service provides APIs for the dashboard-data-extractor module in the UPYOG platform.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /dashboard-data-extractor
x-api-id: org.egov.dashboard.data.extractor
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /api/v1/legacy/ingest:
    post:
      summary: Ingestrange
      description: Ingestrange for dashboard-data-extractor. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Ingestrange completed successfully
          schema:
            $ref: "#/definitions/LegacyIngestionResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Api
      parameters:
        - name: LegacyIngestionResponse
          in: body
          description: Request payload with RequestInfo and domain data for ingestrange
          required: True
          schema:
            $ref: "#/definitions/LegacyIngestionResponse"
  /api/v1/legacy/ingest/last-months:
    post:
      summary: Ingestlastmonths
      description: Ingestlastmonths for dashboard-data-extractor. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Ingestlastmonths completed successfully
          schema:
            $ref: "#/definitions/LegacyIngestionResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Api
      parameters:
        - name: LegacyIngestionResponse
          in: body
          description: Request payload with RequestInfo and domain data for ingestlastmonths
          required: True
          schema:
            $ref: "#/definitions/LegacyIngestionResponse"
definitions:
  LegacyIngestionResponse:
    type: object
    description: Request/Response contract for LegacyIngestionResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      DashboardDataExtractoApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/DashboardDataExtractoApplication"
  DashboardDataExtractoApplication:
    type: object
    description: A domain application object for dashboard-data-extractor
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
