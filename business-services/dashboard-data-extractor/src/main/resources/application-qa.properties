# ============================================================================
# FLAT DELIMITED DATASET FILE GENERATION (e.g. .psv, .csv, .txt)
# ============================================================================
# Toggle to enable generic flat delimited dataset file generation in parallel with Excel
dashboard-data.delimited-file.enabled=true

# Custom delimiter symbol (e.g., |, ,, \t)
dashboard-data.delimited-file.delimiter=|

# Custom dataset file extension suffix (e.g., .psv, .csv, .txt)
dashboard-data.delimited-file.file-extension=.psv

# Option to retain local generated delimited files on disk after S3 upload (default: false)
dashboard-data.delimited-file.keep-file=false
