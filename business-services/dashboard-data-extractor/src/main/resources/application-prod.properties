# Production Environment Configuration

spring.datasource.url=jdbc:postgresql://<prod-db-host>:5432/niuatt
spring.datasource.username=<prod-db-user>
spring.datasource.password=<prod-db-password>

egov.user.host=http://<prod-egov-host>
national.dashboard.ingest.url=${NATIONAL_DASHBOARD_INGEST_URL}
kafka.config.bootstrap_server_config=${KAFKA_BOOTSTRAP_SERVER_CONFIG}

# Additional Environment-Specific Configurations
egov.user.search.path=${EGOV_USER_SEARCH_PATH}
egov.user.oauth.path=${EGOV_USER_OAUTH_PATH}
egov.user.oauth.basic.auth=${EGOV_USER_OAUTH_BASIC_AUTH}

dashboard-data.system.user.username=${DASHBOARD_DATA_SYSTEM_USER_USERNAME}
dashboard-data.system.user.password=${DASHBOARD_DATA_SYSTEM_USER_PASSWORD}
dashboard-data.system.user.tenantId=${DASHBOARD_DATA_SYSTEM_USER_TENANTID}
dashboard-data.system.user.type=${DASHBOARD_DATA_SYSTEM_USER_TYPE}

daily.ingestion.cron=${DAILY_INGESTION_CRON}
dashboard-data.ingestion.default-start-date=${DASHBOARD_DATA_INGESTION_DEFAULT_START_DATE}

legacy.ingestion.enabled=${LEGACY_INGESTION_ENABLED}
legacy.ingestion.execute.cron=${LEGACY_INGESTION_EXECUTE_CRON}
legacy.ingestion.populate.cron=${LEGACY_INGESTION_POPULATE_CRON}
legacy.ingestion.default-months=${LEGACY_INGESTION_DEFAULT_MONTHS}

dashboard-data.metric.ward=${DASHBOARD_DATA_METRIC_WARD}
dashboard-data.metric.region=${DASHBOARD_DATA_METRIC_REGION}
dashboard-data.metric.state=${DASHBOARD_DATA_METRIC_STATE}
dashboard-data.metric.ulb=${DASHBOARD_DATA_METRIC_ULB:}
state.level.tenant.id=${STATE_LEVEL_TENANT_ID:}

dashboard-data.daily.upload-mode=${DASHBOARD_DATA_DAILY_UPLOAD_MODE:API}
dashboard-data.legacy.upload-mode=${DASHBOARD_DATA_LEGACY_UPLOAD_MODE:S3}

aws.s3.access-key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:}
aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.bucket=${AWS_S3_BUCKET:niuatt-filestore}
aws.s3.folder=${AWS_S3_FOLDER:niuatt-internaltech}
