spring.application.name=adapter-service

server.context-path=/adapter-services
server.servlet.context-path=/adapter-services
server.port=9999
app.timezone=UTC

# ============================================================================
# DATASOURCE & FLYWAY MIGRATION
# ============================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/niuatt
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.flyway.enabled=true
spring.flyway.table=as_schema_version
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.outOfOrder=true
spring.flyway.locations=classpath:/db/migration/main

# ============================================================================
# EGOV / UPYOG SERVICE ENDPOINTS
# ============================================================================
egov.user.host=http://localhost:8080/
egov.user.search.path=/user/_search
egov.user.oauth.path=/user/oauth/token?_=1783573693774
egov.user.oauth.basic.auth=Basic ZWdvdi11c2VyLWNsaWVudDo=

# ============================================================================
# ADAPTER SYSTEM USER CREDENTIALS
# ============================================================================
adapter.system.user.username=NDS1
adapter.system.user.password=eGov@123
adapter.system.user.tenantId=pg
adapter.system.user.type=EMPLOYEE
state.level.tenant.id=pg

# ============================================================================
# NATIONAL DASHBOARD INGESTION CONFIGURATION
# ============================================================================
national.dashboard.ingest.url=http://localhost:8081/national-dashboard/metric/_ingest

# At 1:00 AM every day
daily.ingestion.cron=0 0 1 * * ?

# Default fallback start date when no previous successful ingestion record exists
adapter.ingestion.default-start-date=2026-06-01

# Legacy / Historical Bulk Ingestion Configuration
legacy.ingestion.enabled=false
# every month 1st 2 :00 AM
legacy.ingestion.cron=0 0 2 1 * ? 
# time for which this will insert the data
legacy.ingestion.default-months=5

# Metric location context values sent in payload to National Dashboard
# Must match the state and ULB name registered in National Dashboard tenant master
adapter.metric.ulb=pg.citya
adapter.metric.ward=Block 4
adapter.metric.region=Test
adapter.metric.state=pg

# ============================================================================
# KAFKA CONFIGURATION
# ============================================================================
kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=adapter-service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false

kafka.consumer.config.auto_commit=true
kafka.consumer.config.auto_commit_interval=100
kafka.consumer.config.session_timeout=15000
kafka.consumer.config.auto_offset_reset=earliest

kafka.producer.config.retries_config=0
kafka.producer.config.batch_size_config=16384
kafka.producer.config.linger_ms_config=1
kafka.producer.config.buffer_memory_config=33554432

kafka.topics.save.ingestion.detail=save-adapter-ingestion-detail
kafka.topics.save.module.ingestion.detail=save-adapter-module-ingestion-detail
kafka.topics.update.module.ingestion.detail=update-adapter-module-ingestion-detail

# ============================================================================
# LOGGING & DYNAMIC SCHEMA MAPPING
# ============================================================================
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
spring.config.import=optional:classpath:schema-mapping.yml
