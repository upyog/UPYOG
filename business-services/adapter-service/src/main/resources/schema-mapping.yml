# ==============================================================================
# NATIONAL DASHBOARD DATA EXTRACTOR - DYNAMIC MULTI-MODULE SCHEMA MAPPING
# ==============================================================================
#
# INSTRUCTIONS FOR ADDING A NEW MODULE (e.g. TL, WS, PGR, MCOLLECT, FIRENOC, OBPS):
# ------------------------------------------------------------------------------
# Each UPYOG business module tracks module-specific metrics. To add a new module:
#
# STEP 1: Enable the module code under `enabled-modules` below:
#         extractor:
#           enabled-modules:
#             - PT
#             - TL
#
# STEP 2: Add SQL queries under `mappings.<MODULE_CODE>` below.
#         Ensure column aliases (`AS metricName`) match the exact metric key
#         names specified by the National Dashboard for that module.
#
# STEP 3: Implement `<Module>ModuleExtractor` (e.g. `TlModuleExtractor implements ModuleExtractor`)
#         and annotate it with `@Component`. The `ExtractorRegistry` will
#         automatically discover and execute it without changing core code.
# ==============================================================================

extractor:
  # List of business modules enabled for this state deployment
  enabled-modules:
    - PT
    - PGR
    # - TL

  # ----------------------------------------------------------------------------
  # MODULE QUERY MAPPINGS
  # ----------------------------------------------------------------------------
  mappings:

    # ==========================================================================
    # MODULE 1: PROPERTY TAX (PT)
    # Metrics: assessments, todaysTotalApplications, todaysClosedApplications,
    #          noOfPropertiesPaidToday, todaysApprovedApplications,
    #          todaysApprovedApplicationsWithinSLA, avgDaysForApplicationApproval,
    #          pendingApplicationsBeyondTimeline, propertiesRegistered,
    #          assessedProperties, todaysMovedApplications, todaysCollection, etc.
    # ==========================================================================
    PT:
      combinedMetricsQuery: |
        SELECT 
          (SELECT COUNT(*) FROM eg_pt_asmt_assessment WHERE createdtime >= :startTime AND createdtime <= :endTime AND tenantid = :tenantId) AS assessments,
          (SELECT COUNT(*) FROM eg_pt_property WHERE createdtime >= :startTime AND createdtime <= :endTime AND tenantid = :tenantId) AS todaysTotalApplications,
          (SELECT COUNT(DISTINCT businessid) FROM eg_wf_processinstance_v2 WHERE createdtime >= :startTime AND createdtime <= :endTime AND modulename = 'PT' AND action IN ('APPROVE', 'REJECT') AND tenantid = :tenantId) AS todaysClosedApplications,
          (SELECT COUNT(DISTINCT eb.consumercode) FROM egcl_payment ep JOIN egcl_paymentdetail epd ON ep.id = epd.paymentid JOIN egcl_bill eb ON eb.id = epd.billid WHERE ep.transactiondate >= :startTime AND ep.transactiondate <= :endTime AND epd.businessservice = 'PT' AND ep.paymentstatus <> 'CANCELLED' AND ep.tenantid = :tenantId) AS noOfPropertiesPaidToday,
          (SELECT COUNT(DISTINCT businessid) FROM eg_wf_processinstance_v2 WHERE createdtime >= :startTime AND createdtime <= :endTime AND modulename = 'PT' AND action = 'APPROVE' AND tenantid = :tenantId) AS todaysApprovedApplications,
          (SELECT COUNT(DISTINCT p.propertyid) FROM eg_pt_property p JOIN eg_wf_processinstance_v2 pi ON pi.businessid = p.propertyid AND pi.action = 'APPROVE' JOIN eg_wf_businessservice_v2 bs ON bs.businessservice = 'PT.CREATE' AND bs.tenantid = p.tenantid WHERE pi.createdtime >= :startTime AND pi.createdtime <= :endTime AND p.tenantid = :tenantId AND (pi.createdtime - p.createdtime) <= COALESCE(bs.businessservicesla, 2160000000)) AS todaysApprovedApplicationsWithinSLA,
          (SELECT COALESCE(AVG((pi.createdtime - p.createdtime) / (1000.0 * 60 * 60 * 24)), 0) FROM eg_pt_property p JOIN eg_wf_processinstance_v2 pi ON pi.businessid = p.propertyid AND pi.action = 'APPROVE' WHERE pi.createdtime >= :startTime AND pi.createdtime <= :endTime AND p.tenantid = :tenantId) AS avgDaysForApplicationApproval,
         
          -- Properties Registered JSON List
          (SELECT COALESCE(json_agg(json_build_object('name', name, 'value', value)), '[]'::json) FROM (
              SELECT CASE WHEN EXTRACT(MONTH FROM TO_TIMESTAMP(createdtime / 1000)) >= 4 THEN TO_CHAR(TO_TIMESTAMP(createdtime / 1000), 'YYYY') || '-' || TO_CHAR(TO_TIMESTAMP(createdtime / 1000) + INTERVAL '1 year', 'YY') ELSE TO_CHAR(TO_TIMESTAMP(createdtime / 1000) - INTERVAL '1 year', 'YYYY') || '-' || TO_CHAR(TO_TIMESTAMP(createdtime / 1000), 'YY') END AS name, COUNT(*) AS value FROM eg_pt_property WHERE creationreason = 'CREATE' AND tenantid = :tenantId GROUP BY name ORDER BY name
          ) pr) AS propertiesRegisteredJson,

          -- Assessed Properties JSON List
          (SELECT COALESCE(json_agg(json_build_object('name', name, 'value', value)), '[]'::json) FROM (
              SELECT CASE WHEN UPPER(p.usagecategory) LIKE 'RESIDENTIAL%' THEN 'RESIDENTIAL' WHEN UPPER(p.usagecategory) LIKE '%COMMERCIAL%' THEN 'COMMERCIAL' WHEN UPPER(p.usagecategory) LIKE '%INDUSTRIAL%' THEN 'INDUSTRIAL' ELSE 'OTHERS' END AS name, COUNT(DISTINCT a.propertyid) AS value FROM eg_pt_asmt_assessment a JOIN eg_pt_property p ON a.propertyid = p.propertyid WHERE a.createdtime >= :startTime AND a.createdtime <= :endTime AND a.tenantid = :tenantId GROUP BY name
          ) ap) AS assessedPropertiesJson,

          -- Moved Applications JSON List
          (SELECT COALESCE(json_agg(json_build_object('name', name, 'value', value)), '[]'::json) FROM (
              SELECT action AS name, COUNT(*) AS value FROM eg_wf_processinstance_v2 WHERE createdtime >= :startTime AND createdtime <= :endTime AND modulename = 'PT' AND tenantid = :tenantId GROUP BY name
          ) ma) AS movedApplicationsJson

      collectionMetricsQuery: |
        SELECT 
          CASE 
            WHEN UPPER(p.usagecategory) LIKE 'RESIDENTIAL%' THEN 'RESIDENTIAL'
            WHEN UPPER(p.usagecategory) LIKE '%COMMERCIAL%' THEN 'COMMERCIAL'
            WHEN UPPER(p.usagecategory) LIKE '%INDUSTRIAL%' THEN 'INDUSTRIAL'
            ELSE 'OTHERS'
          END AS usage_category,
          ep.paymentmode,
          ep.id AS payment_id,
          bad.taxHeadCode,
          bad.adjustedamount AS tax_head_amount
        FROM egcl_payment ep
        JOIN egcl_paymentdetail epd ON ep.id = epd.paymentid
        JOIN egcl_bill eb ON epd.billid = eb.id
        JOIN egcl_billdetial ebd ON ebd.billid = eb.id
        JOIN egcl_billAccountDetail bad ON bad.billDetailid = ebd.id
        JOIN eg_pt_property p ON eb.consumercode = p.propertyid
        WHERE ep.transactiondate >= :startTime AND ep.transactiondate <= :endTime
          AND epd.businessservice = 'PT'
          AND ep.paymentstatus <> 'CANCELLED'
          AND ep.tenantid = :tenantId

    # ==========================================================================
    # MODULE 2: PUBLIC GRIEVANCE REDRESSAL (PGR)
    # Metrics: slaAchievement, completionRate, uniqueCitizens, todaysComplaints,
    #          todaysReopenedComplaints, todaysOpenComplaints, todaysAssignedComplaints,
    #          averageSolutionTime, todaysRejectedComplaints, todaysReassignedComplaints,
    #          todaysReassignRequestedComplaints, todaysClosedComplaints, todaysResolvedComplaints
    # ==========================================================================
    PGR:
      combinedMetricsQuery: |
        SELECT 
          (SELECT COUNT(DISTINCT COALESCE(accountid, createdby)) FROM eg_pgr_service_v2 WHERE createdtime >= :startTime AND createdtime <= :endTime AND tenantid = :tenantId) AS uniqueCitizens,
          
          -- slaAchievement
          (SELECT COALESCE(json_agg(json_build_object('name', dept, 'value', val)), '[]'::json) FROM (
              SELECT COALESCE(additionaldetails->>'department', 'DEPT1') AS dept, COUNT(*) AS val FROM eg_pgr_service_v2 WHERE createdtime >= :startTime AND createdtime <= :endTime AND tenantid = :tenantId AND (lastmodifiedtime - createdtime) <= 432000000 GROUP BY COALESCE(additionaldetails->>'department', 'DEPT1')
          ) sla) AS slaAchievementJson,

          -- completionRate
          (SELECT COALESCE(json_agg(json_build_object('name', dept, 'value', val)), '[]'::json) FROM (
              SELECT COALESCE(additionaldetails->>'department', 'DEPT1') AS dept, COUNT(*) AS val FROM eg_pgr_service_v2 WHERE createdtime >= :startTime AND createdtime <= :endTime AND tenantid = :tenantId AND applicationstatus IN ('RESOLVED', 'CLOSEDAFTERRESOLUTION', 'CLOSEDAFTERREJECTION') GROUP BY COALESCE(additionaldetails->>'department', 'DEPT1')
          ) cr) AS completionRateJson,

          -- complaintsByStatusJson
          (SELECT COALESCE(json_agg(json_build_object('name', status_name, 'value', val)), '[]'::json) FROM (
              SELECT LOWER(applicationstatus) AS status_name, COUNT(*) AS val FROM eg_pgr_service_v2 WHERE createdtime >= :startTime AND createdtime <= :endTime AND tenantid = :tenantId GROUP BY LOWER(applicationstatus)
          ) s) AS complaintsByStatusJson,
          
          -- complaintsByChannelJson
          (SELECT COALESCE(json_agg(json_build_object('name', UPPER(COALESCE(source, 'WEB')), 'value', val)), '[]'::json) FROM (
              SELECT UPPER(COALESCE(source, 'WEB')) AS source, COUNT(*) AS val FROM eg_pgr_service_v2 WHERE createdtime >= :startTime AND createdtime <= :endTime AND tenantid = :tenantId GROUP BY UPPER(COALESCE(source, 'WEB'))
          ) c) AS complaintsByChannelJson,

          -- complaintsByDepartmentJson
          (SELECT COALESCE(json_agg(json_build_object('name', dept, 'value', val)), '[]'::json) FROM (
              SELECT COALESCE(additionaldetails->>'department', 'DEPT1') AS dept, COUNT(*) AS val FROM eg_pgr_service_v2 WHERE createdtime >= :startTime AND createdtime <= :endTime AND tenantid = :tenantId GROUP BY COALESCE(additionaldetails->>'department', 'DEPT1')
          ) d) AS complaintsByDepartmentJson,

          -- complaintsByCategoryJson
          (SELECT COALESCE(json_agg(json_build_object('name', servicecode, 'value', val)), '[]'::json) FROM (
              SELECT servicecode, COUNT(*) AS val FROM eg_pgr_service_v2 WHERE createdtime >= :startTime AND createdtime <= :endTime AND tenantid = :tenantId GROUP BY servicecode
          ) cat) AS complaintsByCategoryJson,

          -- todaysReopenedComplaintsJson
          (SELECT COALESCE(json_agg(json_build_object('name', dept, 'value', val)), '[]'::json) FROM (
              SELECT COALESCE(additionaldetails->>'department', 'DEPT1') AS dept, COUNT(*) AS val FROM eg_pgr_service_v2 WHERE lastmodifiedtime >= :startTime AND lastmodifiedtime <= :endTime AND tenantid = :tenantId AND applicationstatus = 'PENDINGFORASSIGNMENT' GROUP BY COALESCE(additionaldetails->>'department', 'DEPT1')
          ) reop) AS todaysReopenedComplaintsJson,

          -- todaysOpenComplaintsJson
          (SELECT COALESCE(json_agg(json_build_object('name', dept, 'value', val)), '[]'::json) FROM (
              SELECT COALESCE(additionaldetails->>'department', 'DEPT1') AS dept, COUNT(*) AS val FROM eg_pgr_service_v2 WHERE tenantid = :tenantId AND applicationstatus IN ('PENDINGFORASSIGNMENT', 'PENDINGATLME', 'PENDINGFORREASSIGNMENT') GROUP BY COALESCE(additionaldetails->>'department', 'DEPT1')
          ) opencomp) AS todaysOpenComplaintsJson,

          -- todaysAssignedComplaintsJson
          (SELECT COALESCE(json_agg(json_build_object('name', dept, 'value', val)), '[]'::json) FROM (
              SELECT COALESCE(additionaldetails->>'department', 'DEPT1') AS dept, COUNT(*) AS val FROM eg_pgr_service_v2 WHERE lastmodifiedtime >= :startTime AND lastmodifiedtime <= :endTime AND tenantid = :tenantId AND applicationstatus = 'PENDINGATLME' GROUP BY COALESCE(additionaldetails->>'department', 'DEPT1')
          ) asgn) AS todaysAssignedComplaintsJson,

          -- averageSolutionTimeJson
          (SELECT COALESCE(json_agg(json_build_object('name', dept, 'value', val)), '[]'::json) FROM (
              SELECT COALESCE(additionaldetails->>'department', 'DEPT1') AS dept, COALESCE(ROUND(AVG((lastmodifiedtime - createdtime) / 86400000.0)), 0) AS val FROM eg_pgr_service_v2 WHERE tenantid = :tenantId AND applicationstatus IN ('RESOLVED', 'CLOSEDAFTERRESOLUTION') GROUP BY COALESCE(additionaldetails->>'department', 'DEPT1')
          ) avgsol) AS averageSolutionTimeJson,

          -- todaysRejectedComplaintsJson
          (SELECT COALESCE(json_agg(json_build_object('name', dept, 'value', val)), '[]'::json) FROM (
              SELECT COALESCE(additionaldetails->>'department', 'DEPT1') AS dept, COUNT(*) AS val FROM eg_pgr_service_v2 WHERE lastmodifiedtime >= :startTime AND lastmodifiedtime <= :endTime AND tenantid = :tenantId AND applicationstatus IN ('REJECTED', 'CLOSEDAFTERREJECTION') GROUP BY COALESCE(additionaldetails->>'department', 'DEPT1')
          ) rej) AS todaysRejectedComplaintsJson,

          -- todaysReassignedComplaintsJson
          (SELECT COALESCE(json_agg(json_build_object('name', dept, 'value', val)), '[]'::json) FROM (
              SELECT COALESCE(additionaldetails->>'department', 'DEPT1') AS dept, COUNT(*) AS val FROM eg_pgr_service_v2 WHERE lastmodifiedtime >= :startTime AND lastmodifiedtime <= :endTime AND tenantid = :tenantId AND applicationstatus = 'PENDINGFORREASSIGNMENT' GROUP BY COALESCE(additionaldetails->>'department', 'DEPT1')
          ) reasgn) AS todaysReassignedComplaintsJson,

          -- todaysReassignRequestedComplaintsJson
          (SELECT COALESCE(json_agg(json_build_object('name', dept, 'value', val)), '[]'::json) FROM (
              SELECT COALESCE(additionaldetails->>'department', 'DEPT1') AS dept, COUNT(*) AS val FROM eg_pgr_service_v2 WHERE lastmodifiedtime >= :startTime AND lastmodifiedtime <= :endTime AND tenantid = :tenantId AND applicationstatus = 'PENDINGFORREASSIGNMENT' GROUP BY COALESCE(additionaldetails->>'department', 'DEPT1')
          ) reasgnreq) AS todaysReassignRequestedComplaintsJson,

          -- todaysClosedComplaintsJson
          (SELECT COALESCE(json_agg(json_build_object('name', dept, 'value', val)), '[]'::json) FROM (
              SELECT COALESCE(additionaldetails->>'department', 'DEPT1') AS dept, COUNT(*) AS val FROM eg_pgr_service_v2 WHERE lastmodifiedtime >= :startTime AND lastmodifiedtime <= :endTime AND tenantid = :tenantId AND applicationstatus IN ('CLOSEDAFTERRESOLUTION', 'CLOSEDAFTERREJECTION') GROUP BY COALESCE(additionaldetails->>'department', 'DEPT1')
          ) cls) AS todaysClosedComplaintsJson,

          -- todaysResolvedComplaintsJson
          (SELECT COALESCE(json_agg(json_build_object('name', dept, 'value', val)), '[]'::json) FROM (
              SELECT COALESCE(additionaldetails->>'department', 'DEPT1') AS dept, COUNT(*) AS val FROM eg_pgr_service_v2 WHERE lastmodifiedtime >= :startTime AND lastmodifiedtime <= :endTime AND tenantid = :tenantId AND applicationstatus IN ('RESOLVED', 'CLOSEDAFTERRESOLUTION') GROUP BY COALESCE(additionaldetails->>'department', 'DEPT1')
          ) res) AS todaysResolvedComplaintsJson

    # ==========================================================================
    # MODULE 2: TRADE LICENSE (TL) - TEMPLATE EXAMPLE
    # Metrics: todaysTLApplications, todaysLicensesIssued, todaysTLCollection
    # ==========================================================================
    # TL:
    #   combinedMetricsQuery: |
    