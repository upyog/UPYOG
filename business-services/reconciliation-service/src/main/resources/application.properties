server.port=8081

# Extractor Configurations
reconciliation.data-source.type=ELASTICSEARCH
egov.indexer.host=https://localhost:9200
egov.indexer.username=elastic
egov.indexer.password=8fwbD6HbJh6HU0oddsHm8TEI
# Extractor Service Dependency
state.extractor.enabled=true
extractor.service.url=http://localhost:8081

# Module-to-Index Mappings
reconciliation.es.index.finance=finance-national-dashboard

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Scheduler Configuration
spring.task.scheduling.pool.size=2
reconciliation.job.cron=0 0 10 * * ?

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVER:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

reconciliation.kafka.create.topic=save-reconciliation-details