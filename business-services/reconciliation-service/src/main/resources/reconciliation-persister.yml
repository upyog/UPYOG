serviceMaps:
  serviceName: reconciliation-service
  mappings:
  - version: 1.0
    name: reconciliation-extraction-detail
    description: Saves reconciliation extraction details to the database asynchronously
    fromTopic: save-reconciliation-details
    isTransaction: true
    queryMaps:
    - query: "INSERT INTO ug_recon_extraction_details (config_id, extraction_date, status, acknowledged, data_payload, error_message, created_at) VALUES (?, ?::date, ?, ?, ?::jsonb, ?, CURRENT_TIMESTAMP);"
      basePath: $
      jsonMaps:
      - jsonPath: $.configuration.id
      - jsonPath: $.extractionDate
      - jsonPath: $.status
      - jsonPath: $.acknowledged
      - jsonPath: $.dataPayload
      - jsonPath: $.errorMessage
