app.timezone=UTC
server.port=8281
# ============================================================
# Datasource configuration
# ============================================================

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/egf_collectionvoucher
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.flyway.enabled=true
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.outOfOrder=true
# spring.flyway.table=egf-collectionvoucher_schema_version
spring.flyway.baseline-on-migrate=true
spring.flyway.url=jdbc:postgresql://localhost:5433/egf_collectionvoucher
spring.flyway.locations=classpath:/db/migration/main

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jackson.deserialization.fail-on-unknown-properties=false


# ============================================================
# Kafka general configuration
# ============================================================

# Test-environment Kafka is port-forwarded to localhost:9092
#spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.bootstrap-servers=127.0.0.1:9092

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Use a unique group for this local consumer
spring.kafka.consumer.group-id=fin-refund-local-deepa

# Process only messages published after this local consumer starts
spring.kafka.consumer.auto-offset-reset=latest

# Required because local.disabled.* topics will not exist
spring.kafka.listener.missing-topics-fatal=false


