egov.collection.receipt.voucher.save.topic=local.disabled.receipt-create
egov.collection.receipt.voucher.save.group=local.disabled.receipt-create.group
egov.collection.receipt.voucher.save.id=local.disabled.receipt-create.id

egov.collection.receipt.voucher.cancel.topic=local.disabled.receipt-cancel
egov.collection.receipt.voucher.cancel.group=local.disabled.receipt-cancel.group
egov.collection.receipt.voucher.cancel.id=local.disabled.receipt-cancel.id


