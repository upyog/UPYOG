swagger: 2.0
info:
  version: 1.0.0
  title: CaseManagement Service
  description: |
    Case management utility service.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /case-management
x-api-id: org.egov.case.management
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /case/v1/_create:
    post:
      summary: Create case v1
      description: Create case v1 for case-management. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        201:
          description: Create case v1 completed successfully
          schema:
            $ref: "#/definitions/Void"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Case
      parameters:
        - name: Void
          in: body
          description: Request payload with RequestInfo and domain data for create case v1
          required: True
          schema:
            $ref: "#/definitions/Void"
  /case/v1/_search:
    post:
      summary: Search case v1
      description: Search case v1 for case-management. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Search case v1 completed successfully
          schema:
            $ref: "#/definitions/CaseSearchResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Case
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/requestInfo"
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
        - name: tenantId
          in: query
          description: Unique identifier of ULB
          type: string
          required: False
        - name: ids
          in: query
          type: array
          items:
            type: string
          maxItems: 50
          description: Unique identifiers to search
          required: False
        - name: RequestInfoWrapper
          in: body
          description: RequestInfo metadata and search criteria
          required: True
          schema:
            $ref: "#/definitions/CaseSearchResponse"
  /case/v1/_update:
    post:
      summary: Update case v1
      description: Update case v1 for case-management. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
