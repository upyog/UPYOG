        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Case
      parameters:
        - name: CaseSearchResponse
          in: body
          description: Request payload with RequestInfo and domain data for getdefaultercases
          required: True
          schema:
            $ref: "#/definitions/CaseSearchResponse"
  /cova/v1/_create:
