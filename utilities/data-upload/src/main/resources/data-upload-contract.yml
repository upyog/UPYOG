swagger: 2.0
info:
  version: 1.0.0
  title: DataUpload Service
  description: |
    Generic data upload utility.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /data-upload
x-api-id: org.egov.data.upload
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /{service}/{mapping}/_upload/{service}/{mapping}/_upload:
    post:
      summary: Upload
      description: Upload for data-upload. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Upload completed successfully
          schema:
            $ref: "#/definitions/DataUploaderResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - "{Service}"
      parameters:
        - name: DataUploaderResponse
          in: body
          description: Request payload with RequestInfo and domain data for upload
          required: True
          schema:
            $ref: "#/definitions/DataUploaderResponse"
definitions:
  DataUploaderResponse:
    type: object
    description: Request/Response contract for DataUploaderResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      DataUploadApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/DataUploadApplication"
  DataUploadApplication:
    type: object
    description: A domain application object for data-upload
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
