swagger: 2.0
info:
  version: 1.0.0
  title: UpyogDataGenerator Service
  description: |
    This service provides APIs for the upyog-data-generator module in the UPYOG platform.
  contact:
    name: UPYOG NUDM Team
    email: "cdg-contact@niua.org"
schemes:
  - https
basePath: /upyog-data-generator
x-api-id: org.egov.upyog.data.generator
x-common-path: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml"
paths:
  /create:
    post:
      summary: Create
      description: Create for upyog-data-generator. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Create completed successfully
          schema:
            $ref: "#/definitions/LoadGeneratorResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Create
      parameters:
        - name: LoadGeneratorResponse
          in: body
          description: Request payload with RequestInfo and domain data for create
          required: True
          schema:
            $ref: "#/definitions/LoadGeneratorResponse"
  /delete:
    delete:
      summary: Delete
      description: Delete for upyog-data-generator. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Delete completed successfully
          schema:
            $ref: "#/definitions/String"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Delete
  /status:
    get:
      summary: Getalljobs
      description: Getalljobs for upyog-data-generator. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Getalljobs completed successfully
          schema:
            $ref: "#/definitions/Object"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Status
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
  /status/{jobId}:
    get:
      summary: Getstatus
      description: Getstatus for upyog-data-generator. Follows DIGIT API conventions with RequestInfo in body and ResponseInfo in response.
      responses:
        200:
          description: Getstatus completed successfully
          schema:
            $ref: "#/definitions/LoadGeneratorResponse"
        400:
          description: Invalid input
          schema:
            $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes"
      tags:
        - Status
      parameters:
        - $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/parameters/tenantId"
definitions:
  LoadGeneratorResponse:
    type: object
    description: Request/Response contract for LoadGeneratorResponse
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      UpyogDataGeneratoApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/UpyogDataGeneratoApplication"
  String:
    type: object
    description: Request/Response contract for String
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      UpyogDataGeneratoApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/UpyogDataGeneratoApplication"
  Object:
    type: object
    description: Request/Response contract for Object
    properties:
      RequestInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo"
      ResponseInfo:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo"
      UpyogDataGeneratoApplications:
        type: array
        description: Domain application objects
        items:
          $ref: "#/definitions/UpyogDataGeneratoApplication"
  UpyogDataGeneratoApplication:
    type: object
    description: A domain application object for upyog-data-generator
    properties:
      id:
        type: string
        description: Unique identifier (UUID)
        readOnly: true
      tenantId:
        type: string
        description: Unique identifier of ULB
        maxLength: 128
        minLength: 2
      applicationNumber:
        type: string
        description: Unique application number
        readOnly: true
      status:
        type: string
        description: Application status
      auditDetails:
        $ref: "https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails"
    required:
      - tenantId
  Workflow:
    type: object
    description: Fields related to workflow service
    properties:
      action:
        type: string
        description: Action on the application
      status:
        type: string
        description: Status of the application
      comments:
        type: string
        description: Comments for the action
